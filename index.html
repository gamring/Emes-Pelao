<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emes & Pelao - Sistema de Control de Fletes</title>
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script>
    // System Error Boundary Guard
    window.addEventListener('error', function(e) {
      console.error('[Enterprise System Error Log]:', e);
      const rootDiv = document.getElementById('root');
      if (rootDiv && (!rootDiv.children || rootDiv.children.length === 0)) {
        rootDiv.innerHTML = '<div style="padding:40px; text-align:center; color:#f87171; background-color:#0f172a; border-radius:12px; margin:20px; border:1px solid #1e293b;"><h2>⚠️ Excepción Runtime Detectada</h2><p style="color:#94a3b8; font-size:14px; margin-top:8px;">Se ha detectado una inconsistencia de datos.</p><button onclick="localStorage.clear();location.reload();" style="background:#059669;color:white;padding:10px 24px;border:none;border-radius:8px;font-weight:bold;margin-top:16px;cursor:pointer;">Restablecer Sistema</button></div>';
      }
    });
  </script>

  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    // --- ICONOS VECTORIALES ---
    const Truck = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-5 h-5' },
      h('path', { d: 'M14 18H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v10' }),
      h('path', { d: 'M14 10h4l4 4v4H14v-8z' }),
      h('circle', { cx: '7.5', cy: '18.5', r: '2.5' }),
      h('circle', { cx: '18.5', cy: '18.5', r: '2.5' })
    );

    const Lock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('rect', { x: '3', y: '11', width: '18', height: '11', rx: '2' }),
      h('path', { d: 'M7 11V7a5 5 0 0 1 10 0v4' })
    );

    const Clock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-5 h-5' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('polyline', { points: '12 6 12 12 16 14' })
    );

    const FileText = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('path', { d: 'M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z' })
    );

    const PlusCircle = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('line', { x1: '12', y1: '8', x2: '12', y2: '16' }),
      h('line', { x1: '8', y1: '12', x2: '16', y2: '12' })
    );

    const Camera = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('path', { d: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z' }),
      h('circle', { cx: '12', cy: '13', r: '4' })
    );

    const Trash2 = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('polyline', { points: '3 6 5 6 21 6' }),
      h('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6' })
    );

    const Edit = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('path', { d: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7' }),
      h('path', { d: 'M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z' })
    );

    const LogOut = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('path', { d: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4' }),
      h('polyline', { points: '16 17 21 12 16 7' }),
      h('line', { x1: '21', y1: '12', x2: '9', y2: '12' })
    );

    const Download = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', className: 'w-4 h-4' },
      h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
      h('polyline', { points: '7 10 12 15 17 10' }),
      h('line', { x1: '12', y1: '15', x2: '12', y2: '3' })
    );

    // --- CONFIGURACIÓN DE DISPOSITIVOS ---
    const DEFAULT_DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Emes', role: 'Emes (Consulta & Beneficios)', defaultPin: '1234' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Pelao', role: 'Pelao (Consulta & Beneficios)', defaultPin: '1234' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total (Crear, Modificar, Eliminar)', defaultPin: '0000' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor (Consulta Operativa Gastos)', defaultPin: '1234' }
    ];

    const INITIAL_MOVEMENTS = [
      { id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central', destination: 'Valparaíso Puerto', amount: 300000, date: '2026-10-25', invoicingStatus: 'Factura Pagada', createdBy: 'Dispositivo 3 - Administrador General' },
      { id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25', description: 'Carga Diésel Shell', createdBy: 'Dispositivo 3 - Administrador General' },
      { id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua', destination: 'Coquimbo', amount: 480000, date: '2026-10-27', invoicingStatus: 'No Facturado', createdBy: 'Dispositivo 3 - Administrador General' },
      { id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27', description: 'Estación Copec', createdBy: 'Dispositivo 3 - Administrador General' }
    ];

    function App() {
      const [movements, setMovements] = useState(() => {
        try {
          const saved = localStorage.getItem('fletes_v6_enterprise');
          return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
        } catch (e) { return INITIAL_MOVEMENTS; }
      });

      const [currentDevice, setCurrentDevice] = useState(DEFAULT_DEVICES[2].name);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('2026-10');

      const [isFreightModalOpen, setIsFreightModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);

      const [freightForm, setFreightForm] = useState({ client: '', origin: '', destination: '', amount: '', date: '2026-10-28', invoicingStatus: 'No Facturado' });
      const [expenseForm, setExpenseForm] = useState({ category: 'Combustible', amount: '', description: '', date: '2026-10-28' });

      const activeDeviceObj = useMemo(() => DEFAULT_DEVICES.find(d => d.name === currentDevice) || DEFAULT_DEVICES[2], [currentDevice]);
      const isAdmin = activeDeviceObj.roleKey === 'admin';

      useEffect(() => {
        try { localStorage.setItem('fletes_v6_enterprise', JSON.stringify(movements)); } catch (e) {}
      }, [movements]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === activeDeviceObj.defaultPin) {
          setIsAuthenticated(true);
          setLoginError('');
          setPinInput('');
        } else {
          setLoginError(`PIN inválido (PIN Admin: 0000 | Otros: 1234)`);
        }
      };

      const monthlyMovements = useMemo(() => {
        const filtered = movements.filter(m => m.date && m.date.startsWith(selectedMonth));
        if (activeDeviceObj.roleKey === 'driver2') {
          return filtered.filter(m => m.type === 'expense');
        }
        return filtered;
      }, [movements, selectedMonth, activeDeviceObj]);

      const metrics = useMemo(() => {
        let totalFreights = 0, totalExpenses = 0, netFreights = 0;
        let paidInvoices = 0, pendingInvoices = 0, unInvoiced = 0;

        monthlyMovements.forEach(m => {
          const amount = Number(m.amount) || 0;
          if (m.type === 'freight') {
            totalFreights += amount;
            if (m.invoicingStatus === 'Factura Pagada') {
              paidInvoices += amount;
              netFreights += Math.round(amount / 1.19);
            } else if (m.invoicingStatus === 'Factura Pendiente') {
              pendingInvoices += amount;
              netFreights += Math.round(amount / 1.19);
            } else {
              unInvoiced += amount;
              netFreights += amount;
            }
          } else {
            totalExpenses += amount;
          }
        });

        const totalCashIn = paidInvoices + unInvoiced;
        const netTotal = netFreights - totalExpenses;
        const halfShare = netTotal > 0 ? netTotal * 0.5 : 0;

        return { totalFreights, totalExpenses, netTotal, paidInvoices, pendingInvoices, unInvoiced, totalCashIn, ownerShare: halfShare, driver1Share: halfShare };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val);

      // --- ACCIONES ADMIN ---
      const handleDelete = (id) => {
        if (!isAdmin) return alert('Solo Administrador General.');
        if (confirm('¿Confirmas la eliminación permanente de este registro?')) {
          setMovements(movements.filter(m => m.id !== id));
        }
      };

      const handleStartEdit = (item) => {
        if (!isAdmin) return alert('Solo Administrador General.');
        setEditingId(item.id);
        if (item.type === 'freight') {
          setFreightForm({ client: item.client, origin: item.origin || '', destination: item.destination || '', amount: item.amount, date: item.date, invoicingStatus: item.invoicingStatus || 'No Facturado' });
          setIsFreightModalOpen(true);
        } else {
          setExpenseForm({ category: item.category, amount: item.amount, description: item.description, date: item.date });
          setIsExpenseModalOpen(true);
        }
      };

      const handleUpdateInvoicingStatus = (id, newStatus) => {
        if (!isAdmin) return alert('Solo Administrador General.');
        setMovements(movements.map(m => m.id === id ? { ...m, invoicingStatus: newStatus } : m));
      };

      const handleSaveFreight = (e) => {
        e.preventDefault();
        if (!isAdmin) return alert('Solo Administrador General.');
        if (!freightForm.client || !freightForm.amount) return;

        if (editingId) {
          setMovements(movements.map(m => m.id === editingId ? { ...m, ...freightForm, amount: Number(freightForm.amount) } : m));
          setEditingId(null);
        } else {
          setMovements([{ id: `fl-${Date.now().toString().slice(-4)}`, type: 'freight', ...freightForm, amount: Number(freightForm.amount), createdBy: currentDevice }, ...movements]);
        }
        setIsFreightModalOpen(false);
        setFreightForm({ client: '', origin: '', destination: '', amount: '', date: '2026-10-28', invoicingStatus: 'No Facturado' });
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!isAdmin) return alert('Solo Administrador General.');
        if (!expenseForm.amount || !expenseForm.description) return;

        if (editingId) {
          setMovements(movements.map(m => m.id === editingId ? { ...m, ...expenseForm, amount: Number(expenseForm.amount) } : m));
          setEditingId(null);
        } else {
          setMovements([{ id: `exp-${Date.now().toString().slice(-4)}`, type: 'expense', ...expenseForm, amount: Number(expenseForm.amount), createdBy: currentDevice }, ...movements]);
        }
        setIsExpenseModalOpen(false);
        setExpenseForm({ category: 'Combustible', amount: '', description: '', date: '2026-10-28' });
      };

      const handleExportCSV = () => {
        if (monthlyMovements.length === 0) return alert('No existen registros.');
        const headers = ["ID", "Fecha", "Tipo", "Cliente/Categoria", "Origen", "Destino", "Monto CLP", "Facturacion", "Creado Por"];
        const rows = monthlyMovements.map(m => [
          m.id, m.date, m.type === 'freight' ? 'Flete' : 'Gasto',
          `"${m.client || m.category}"`, `"${m.origin || '-'}"`, `"${m.destination || '-'}"`,
          m.amount, m.invoicingStatus || '-', `"${m.createdBy}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
        const link = document.createElement("a");
        link.href = encodeURI(csvContent);
        link.download = `Informe_Gestion_${selectedMonth}.csv`;
        link.click();
      };

      // --- AUTENTICACIÓN ---
      if (!isAuthenticated) {
        return h('div', { className: 'min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4' },
          h('div', { className: 'max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 text-center shadow-2xl' },
            h('div', { className: 'w-12 h-12 bg-slate-800 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400' }, h(Lock)),
            h('div', null,
              h('h2', { className: 'text-base font-extrabold text-white' }, currentDevice),
              h('p', { className: 'text-xs text-slate-400 mt-1 font-medium' }, activeDeviceObj.role)
            ),
            h('form', { onSubmit: handleLogin, className: 'space-y-4' },
              h('input', {
                type: 'password', maxLength: 10, required: true, autoFocus: true,
                placeholder: 'Ingresa PIN de Acceso', value: pinInput,
                onChange: (e) => setPinInput(e.target.value),
                className: 'w-full text-center bg-slate-950 border border-slate-700 rounded-xl py-3 text-lg font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 tracking-widest'
              }),
              loginError && h('p', { className: 'text-xs text-rose-400 font-bold' }, loginError),
              h('button', { type: 'submit', className: 'w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs uppercase text-white transition-all shadow-lg' }, 'Autenticar')
            ),
            h('div', { className: 'pt-4 border-t border-slate-800' },
              h('p', { className: 'text-[11px] text-slate-400 mb-2 font-bold' }, 'Seleccionar Perfil:'),
              h('select', {
                value: currentDevice, onChange: (e) => setCurrentDevice(e.target.value),
                className: 'bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2.5 focus:outline-none w-full cursor-pointer'
              }, DEFAULT_DEVICES.map(d => h('option', { key: d.id, value: d.name }, d.name)))
            )
          )
        );
      }

      // --- DASHBOARD ---
      return h('div', { className: 'min-h-screen bg-slate-950 text-slate-100 pb-20' },
        h('header', { className: 'bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg' },
          h('div', { className: 'max-w-6xl mx-auto flex justify-between items-center gap-3' },
            h('div', { className: 'flex items-center gap-2.5' },
              h('div', { className: 'p-2.5 bg-emerald-600 text-white rounded-xl shadow' }, h(Truck)),
              h('div', null,
                h('h1', { className: 'font-black text-xl text-white tracking-tight' }, 'Emes&Pelao'),
                h('p', { className: 'text-[10px] text-emerald-400 font-extrabold uppercase tracking-widest' }, 'Sistema de Control de Fletes')
              )
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('span', { className: `hidden md:inline text-xs px-3.5 py-1.5 rounded-xl font-extrabold border ${isAdmin ? 'text-amber-400 bg-amber-950/40 border-amber-800' : 'text-emerald-400 bg-slate-800 border-slate-700'}` }, activeDeviceObj.name),
              h('button', { onClick: () => setIsAuthenticated(false), className: 'p-2.5 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl border border-slate-700 shadow transition-all', title: 'Cerrar Sesión' }, h(LogOut))
            )
          )
        ),
        h('main', { className: 'max-w-6xl mx-auto p-4 space-y-6' },
          h('div', { className: 'bg-slate-900 p-4.5 rounded-2xl border border-slate-800 flex flex-col lg:flex-row justify-between items-center gap-4 shadow-xl' },
            h('div', { className: 'flex items-center gap-3 w-full lg:w-auto' },
              h('div', { className: 'text-slate-400' }, h(Clock)),
              h('span', { className: 'text-xs text-slate-300 font-bold uppercase tracking-wider' }, 'Mes:'),
              h('input', { type: 'month', value: selectedMonth, onChange: (e) => setSelectedMonth(e.target.value), className: 'bg-slate-800 border border-slate-700 px-3.5 py-2 rounded-xl text-xs font-black text-white focus:outline-none focus:border-emerald-500' })
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2.5 w-full lg:w-auto' },
              h('button', { onClick: handleExportCSV, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-emerald-500/50 text-emerald-400 font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow' }, h(Download), 'Exportar Excel'),
              
              isAdmin ? [
                h('button', { key: 'btn-add-fl', onClick: () => { setEditingId(null); setIsFreightModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs px-4.5 py-2.5 rounded-xl shadow transition' }, h(PlusCircle), '+ Flete'),
                h('button', { key: 'btn-add-exp', onClick: () => { setEditingId(null); setIsExpenseModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-500 text-white font-black text-xs px-4.5 py-2.5 rounded-xl shadow transition' }, h(Camera), '+ Gasto')
              ] : h('span', { className: 'text-[11px] text-slate-400 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 font-bold' }, '🔒 Modo Consulta')
            )
          ),

          activeDeviceObj.roleKey === 'driver2' ? 
          h('div', { className: 'bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl' },
            h('span', { className: 'text-xs text-rose-400 font-black tracking-wider block mb-1.5 uppercase' }, 'MIS GASTOS OPERATIVOS REGISTRADOS'),
            h('p', { className: 'text-4xl font-black text-rose-400' }, formatMoney(metrics.totalExpenses))
          ) :
          h('div', { className: 'space-y-5' },
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-5' },
              h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow' },
                h('span', { className: 'text-[11px] text-slate-400 font-extrabold uppercase tracking-widest' }, 'TOTAL FLETES'),
                h('p', { className: 'text-3xl font-black text-emerald-400 mt-1' }, formatMoney(metrics.totalFreights))
              ),
              h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow' },
                h('span', { className: 'text-[11px] text-slate-400 font-extrabold uppercase tracking-widest' }, 'TOTAL GASTOS'),
                h('p', { className: 'text-3xl font-black text-rose-400 mt-1' }, formatMoney(metrics.totalExpenses))
              ),
              h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow' },
                h('span', { className: 'text-[11px] text-slate-400 font-extrabold uppercase tracking-widest flex items-center gap-1.5' }, 'UTILIDAD NETA TOTAL', h('span', { className: 'text-[8px] font-black text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded' }, 'NETO IVA FACTURA')),
                h('p', { className: 'text-3xl font-black text-white mt-1' }, formatMoney(metrics.netTotal))
              )
            ),
            h('div', { className: 'bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-3' },
              h('h3', { className: 'text-xs font-black text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2' }, 'Métricas de Facturación & Cobranza'),
              h('div', { className: 'grid grid-cols-1 sm:grid-cols-4 gap-4' },
                h('div', { className: 'bg-slate-950 p-4 rounded-xl border border-emerald-900/50' }, h('span', { className: 'text-[10px] font-extrabold text-emerald-400 uppercase block' }, 'FACTURA PAGADA'), h('p', { className: 'text-xl font-black text-emerald-400 mt-1' }, formatMoney(metrics.paidInvoices))),
                h('div', { className: 'bg-slate-950 p-4 rounded-xl border border-amber-900/50' }, h('span', { className: 'text-[10px] font-extrabold text-amber-400 uppercase block' }, 'FACTURA PENDIENTE'), h('p', { className: 'text-xl font-black text-amber-400 mt-1' }, formatMoney(metrics.pendingInvoices))),
                h('div', { className: 'bg-slate-950 p-4 rounded-xl border border-slate-800' }, h('span', { className: 'text-[10px] font-extrabold text-slate-400 uppercase block' }, 'NO FACTURADO / EMITIDO'), h('p', { className: 'text-xl font-black text-slate-300 mt-1' }, formatMoney(metrics.unInvoiced))),
                h('div', { className: 'bg-slate-950 p-4 rounded-xl border border-emerald-500/30' }, h('span', { className: 'text-[10px] font-extrabold text-emerald-300 uppercase block' }, 'INGRESOS COBRADOS REALES'), h('p', { className: 'text-xl font-black text-emerald-300 mt-1' }, formatMoney(metrics.totalCashIn)))
              )
            )
          ),

          activeDeviceObj.roleKey !== 'driver2' && h('div', { className: 'bg-slate-900 border border-slate-800 p-5.5 rounded-2xl shadow-lg grid grid-cols-1 sm:grid-cols-2 gap-5' },
            h('div', { className: 'border-b sm:border-b-0 sm:border-r border-slate-800 pb-4 sm:pb-0 sm:pr-4' },
              h('span', { className: 'text-xs font-black text-emerald-400 uppercase tracking-wider' }, '50% MARGEN EMES'),
              h('p', { className: 'text-3.5xl font-black text-emerald-400 mt-2' }, formatMoney(metrics.driver1Share))
            ),
            h('div', { className: 'pt-4 sm:pt-0' },
              h('span', { className: 'text-xs font-black text-amber-400 uppercase tracking-wider' }, '50% MARGEN PELAO'),
              h('p', { className: 'text-3.5xl font-black text-amber-400 mt-2' }, formatMoney(metrics.ownerShare))
            )
          ),

          h('div', { className: 'bg-slate-900 rounded-2xl border border-slate-800 p-5.5 space-y-4 shadow-xl' },
            h('h3', { className: 'font-black text-sm text-white flex items-center gap-2 border-b border-slate-800 pb-3 uppercase tracking-wide' }, h(FileText), activeDeviceObj.roleKey === 'driver2' ? 'Gastos Registrados' : 'Historial de Movimientos Registrados'),
            h('div', { className: 'space-y-2.5' },
              monthlyMovements.length === 0 ? h('p', { className: 'text-xs text-slate-500 py-6 text-center font-bold' }, 'No existen movimientos en el mes seleccionado.') :
              monthlyMovements.map(item => h('div', { key: item.id, className: 'bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs gap-3 shadow' },
                h('div', { className: 'space-y-1' },
                  h('div', { className: 'flex items-center gap-2 flex-wrap' },
                    h('p', { className: `font-extrabold text-[13.5px] ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}` }, item.type === 'freight' ? `Flete: ${item.client}` : `Gasto: ${item.category}`),
                    
                    item.type === 'freight' && (
                      isAdmin ? h('select', {
                        value: item.invoicingStatus,
                        onChange: (e) => handleUpdateInvoicingStatus(item.id, e.target.value),
                        className: 'bg-slate-800 text-[10px] font-bold text-slate-200 border border-slate-700 rounded px-2 py-0.5 focus:outline-none cursor-pointer'
                      },
                        h('option', { value: 'No Facturado' }, 'No Facturado'),
                        h('option', { value: 'Factura Pagada' }, 'Factura Pagada'),
                        h('option', { value: 'Factura Pendiente' }, 'Factura Pendiente')
                      ) : h('span', { className: `text-[8.5px] font-black px-2 py-0.5 rounded uppercase ${item.invoicingStatus === 'No Facturado' ? 'bg-slate-800 text-slate-300' : item.invoicingStatus === 'Factura Pagada' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}` }, item.invoicingStatus)
                    )
                  ),
                  h('p', { className: 'text-slate-300 text-[11px] font-semibold' }, item.type === 'freight' ? `${item.origin} ➔ ${item.destination}` : item.description),
                  h('span', { className: 'text-slate-400 text-[10px] font-semibold block pt-1.5' }, `${item.date} • ${item.createdBy}`)
                ),
                h('div', { className: 'flex items-center gap-2 shrink-0' },
                  h('span', { className: `font-black text-[14px] ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}` }, `${item.type === 'freight' ? '+' : '-'}${formatMoney(item.amount)}`),
                  
                  // BOTONES DE EDICIÓN Y ELIMINACIÓN PARA ADMIN
                  isAdmin && h('button', { onClick: () => handleStartEdit(item), className: 'bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-lg border border-slate-700 transition-all ml-1', title: 'Editar Registro' }, h(Edit)),
                  isAdmin && h('button', { onClick: () => handleDelete(item.id), className: 'bg-slate-800 hover:bg-slate-700 text-rose-400 p-2 rounded-lg border border-slate-700 transition-all', title: 'Eliminar Registro' }, h(Trash2))
                )
              ))
            )
          )
        ),

        // MODAL FLETE
        isFreightModalOpen && h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('h3', { className: 'font-black text-sm text-white border-b border-slate-800 pb-2' }, editingId ? 'Editar Flete' : 'Ingresar Nuevo Flete'),
            h('form', { onSubmit: handleSaveFreight, className: 'space-y-3.5 text-xs' },
              h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Cliente *'), h('input', { type: 'text', required: true, value: freightForm.client, onChange: e => setFreightForm({ ...freightForm, client: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-bold focus:outline-none focus:border-emerald-500' })),
              h('div', { className: 'grid grid-cols-2 gap-2.5' },
                h('div', null, h('label', { className: 'text-slate-400 block mb-1' }, 'Origen'), h('input', { type: 'text', value: freightForm.origin, onChange: e => setFreightForm({ ...freightForm, origin: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500' })),
                h('div', null, h('label', { className: 'text-slate-400 block mb-1' }, 'Destino'), h('input', { type: 'text', value: freightForm.destination, onChange: e => setFreightForm({ ...freightForm, destination: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500' }))
              ),
              h('div', { className: 'grid grid-cols-2 gap-2.5' },
                h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Monto CLP *'), h('input', { type: 'number', required: true, value: freightForm.amount, onChange: e => setFreightForm({ ...freightForm, amount: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-emerald-400 font-black focus:outline-none focus:border-emerald-500' })),
                h('div', null, h('label', { className: 'text-slate-400 block mb-1' }, 'Fecha'), h('input', { type: 'date', value: freightForm.date, onChange: e => setFreightForm({ ...freightForm, date: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500' }))
              ),
              h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Estado Facturación'), h('select', { value: freightForm.invoicingStatus, onChange: e => setFreightForm({ ...freightForm, invoicingStatus: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-extrabold focus:outline-none focus:border-emerald-500' }, ['No Facturado', 'Factura Pagada', 'Factura Pendiente'].map(c => h('option', { key: c, value: c }, c)))),
              h('div', { className: 'flex justify-end gap-2 pt-4 border-t border-slate-800' },
                h('button', { type: 'button', onClick: () => { setIsFreightModalOpen(false); setEditingId(null); }, className: 'px-4 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold hover:bg-slate-700' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow' }, editingId ? 'Guardar Cambios' : 'Guardar Flete')
              )
            )
          )
        ),

        // MODAL GASTO
        isExpenseModalOpen && h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('h3', { className: 'font-black text-sm text-white border-b border-slate-800 pb-2' }, editingId ? 'Editar Gasto' : 'Ingresar Gasto Operativo'),
            h('form', { onSubmit: handleSaveExpense, className: 'space-y-3.5 text-xs' },
              h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Categoría'), h('select', { value: expenseForm.category, onChange: e => setExpenseForm({ ...expenseForm, category: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-extrabold focus:outline-none focus:border-rose-500' }, ['Combustible', 'Viáticos', 'Peajes', 'Reparaciones'].map(c => h('option', { key: c, value: c }, c)))),
              h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Descripción *'), h('input', { type: 'text', required: true, value: expenseForm.description, onChange: e => setExpenseForm({ ...expenseForm, description: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white font-bold focus:outline-none focus:border-rose-500', placeholder: 'Ej: Diésel Copec' })),
              h('div', { className: 'grid grid-cols-2 gap-2.5' },
                h('div', null, h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Monto CLP *'), h('input', { type: 'number', required: true, value: expenseForm.amount, onChange: e => setExpenseForm({ ...expenseForm, amount: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-rose-400 font-black focus:outline-none focus:border-rose-500' })),
                h('div', null, h('label', { className: 'text-slate-400 block mb-1' }, 'Fecha'), h('input', { type: 'date', value: expenseForm.date, onChange: e => setExpenseForm({ ...expenseForm, date: e.target.value }), className: 'w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500' }))
              ),
              h('div', { className: 'flex justify-end gap-2 pt-4 border-t border-slate-800' },
                h('button', { type: 'button', onClick: () => { setIsExpenseModalOpen(false); setEditingId(null); }, className: 'px-4 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold hover:bg-slate-700' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl shadow' }, editingId ? 'Guardar Cambios' : 'Guardar Gasto')
              )
            )
          )
        )
      );
    }

    // MOUNT
    document.addEventListener('DOMContentLoaded', function() {
      const rootNode = document.getElementById('root');
      if (typeof ReactDOM.createRoot === 'function') {
        ReactDOM.createRoot(rootNode).render(h(App));
      } else {
        ReactDOM.render(h(App), rootNode);
      }
    });
  </script>
</body>
</html>
