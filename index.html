<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Fletes y Servicios</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICONOS LUCIDE ADAPTADOS ---
    const Truck = () => <i data-lucide="truck" className="w-5 h-5"></i>;
    const Receipt = () => <i data-lucide="receipt" className="w-5 h-5"></i>;
    const BarChart3 = () => <i data-lucide="bar-chart-3" className="w-5 h-5"></i>;
    const Clock = () => <i data-lucide="clock" className="w-5 h-5"></i>;
    const PlusCircle = () => <i data-lucide="plus-circle" className="w-4 h-4"></i>;
    const FileText = () => <i data-lucide="file-text" className="w-4 h-4"></i>;
    const Trash2 = () => <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>;

    const INITIAL_MOVEMENTS = [
      {
        id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central',
        destination: 'Valparaíso Puerto', amount: 300000, vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', date: '2026-10-25', status: 'Completado',
        invoicingStatus: 'Factura Pagada', paymentStatus: 'Pagado', notes: 'Encofrados metálicos.', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25',
        description: 'Carga Diésel Shell', vehicle: 'Camión Volvo FH 4x2', driverName: 'Emes', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua',
        destination: 'Coquimbo', amount: 480000, vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', date: '2026-10-27', status: 'En Curso',
        invoicingStatus: 'Factura Emitida (Pendiente)', paymentStatus: 'Pendiente', notes: 'Frutas refrigeradas.', createdBy: 'Dispositivo 4 - Conductor 2'
      },
      {
        id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27',
        description: 'Estación Copec', vehicle: 'Mercedes-Benz Actros', driverName: 'Conductor 2', createdBy: 'Dispositivo 4 - Conductor 2'
      }
    ];

    const DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Emes', role: 'Emes (50% Beneficio Total)' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Pelao', role: 'Pelao (50% Beneficio Total)' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total & Facturación' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor Registro Gastos' }
    ];

    const EXPENSE_CATEGORIES = ['Combustible', 'Viáticos', 'Peajes', 'Reparaciones'];
    const INVOICE_STATUSES = ['No Facturado', 'Factura Emitida (Pendiente)', 'Factura Pagada'];

    function App() {
      const [movements, setMovements] = useState(() => {
        const saved = localStorage.getItem('fletes_movements');
        return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
      });

      const [currentDevice, setCurrentDevice] = useState(DEVICES[2].name);
      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      
      // Modales de Registro
      const [isFreightModalOpen, setIsFreightModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);

      // Formularios
      const [freightForm, setFreightForm] = useState({
        client: '', origin: '', destination: '', amount: '', date: new Date().toISOString().split('T')[0],
        driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2', invoicingStatus: 'No Facturado'
      });

      const [expenseForm, setExpenseForm] = useState({
        category: EXPENSE_CATEGORIES[0], amount: '', description: '',
        date: new Date().toISOString().split('T')[0], driverName: 'Emes'
      });

      const activeDeviceObj = useMemo(() => DEVICES.find(d => d.name === currentDevice) || DEVICES[2], [currentDevice]);

      useEffect(() => {
        localStorage.setItem('fletes_movements', JSON.stringify(movements));
        if (window.lucide) window.lucide.createIcons();
      }, [movements, currentDevice, isFreightModalOpen, isExpenseModalOpen]);

      const monthlyMovements = useMemo(() => movements.filter(m => m.date && m.date.startsWith(selectedMonth)), [movements, selectedMonth]);

      // Métricas globales y estado de Facturación
      const metrics = useMemo(() => {
        let totalFreights = 0, totalExpenses = 0;
        let totalIssuedInvoices = 0, totalPaidInvoices = 0;

        monthlyMovements.forEach(m => {
          if (m.type === 'freight') {
            const amt = Number(m.amount) || 0;
            totalFreights += amt;

            if (m.invoicingStatus === 'Factura Emitida (Pendiente)') {
              totalIssuedInvoices += amt;
            } else if (m.invoicingStatus === 'Factura Pagada') {
              totalPaidInvoices += amt;
            }
          } else {
            totalExpenses += Number(m.amount) || 0;
          }
        });

        const netTotal = totalFreights - totalExpenses;
        const halfShare = netTotal > 0 ? netTotal * 0.5 : 0;

        return {
          totalFreights,
          totalExpenses,
          netTotal,
          ownerShare: halfShare,   // 50% para Pelao
          driver1Share: halfShare, // 50% para Emes
          totalIssuedInvoices,
          totalPaidInvoices
        };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val);

      // Cambiar Estado de Factura directamente
      const handleInvoiceStatusChange = (id, newStatus) => {
        setMovements(movements.map(m => m.id === id ? { ...m, invoicingStatus: newStatus } : m));
      };

      // Guardar Flete Nuevo
      const handleSaveFreight = (e) => {
        e.preventDefault();
        if (!freightForm.client || !freightForm.amount) return;

        const newItem = {
          id: `fl-${Date.now().toString().slice(-4)}`,
          type: 'freight',
          ...freightForm,
          amount: Number(freightForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsFreightModalOpen(false);
        setFreightForm({ client: '', origin: '', destination: '', amount: '', date: new Date().toISOString().split('T')[0], driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2', invoicingStatus: 'No Facturado' });
      };

      // Guardar Gasto Nuevo
      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.amount || !expenseForm.description) return;

        const newItem = {
          id: `exp-${Date.now().toString().slice(-4)}`,
          type: 'expense',
          ...expenseForm,
          amount: Number(expenseForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsExpenseModalOpen(false);
        setExpenseForm({ category: EXPENSE_CATEGORIES[0], amount: '', description: '', date: new Date().toISOString().split('T')[0], driverName: 'Emes' });
      };

      const handleDelete = (id) => {
        if (confirm('¿Deseas eliminar este registro?')) {
          setMovements(movements.filter(m => m.id !== id));
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-20">
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <div className="p-2 bg-emerald-600 rounded-xl"><Truck /></div>
                <div>
                  <h1 className="font-bold text-lg">FletesSync</h1>
                  <p className="text-[10px] text-emerald-400 font-semibold uppercase">Gestión de Fletes • Emes & Pelao</p>
                </div>
              </div>

              <select 
                value={currentDevice} 
                onChange={(e) => setCurrentDevice(e.target.value)}
                className="bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2 focus:outline-none"
              >
                {DEVICES.map(d => <option key={d.id} value={d.name}>{d.name} ({d.role})</option>)}
              </select>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4 space-y-6">
            
            {/* BARRA SUPERIOR */}
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2">
                <Clock />
                <span className="text-xs text-slate-400">Mes:</span>
                <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="bg-transparent text-sm font-bold text-white focus:outline-none cursor-pointer" />
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                {activeDeviceObj.roleKey !== 'driver2' && (
                  <button 
                    onClick={() => setIsFreightModalOpen(true)}
                    className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg transition"
                  >
                    <PlusCircle /> + Ingresar Flete
                  </button>
                )}
                <button 
                  onClick={() => setIsExpenseModalOpen(true)}
                  className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg transition"
                >
                  <PlusCircle /> + Ingresar Gasto
                </button>
              </div>
            </div>

            {/* VISTA CONDUCTOR 4 / DISPOSITIVO 4 */}
            {activeDeviceObj.roleKey === 'driver2' ? (
              <div className="space-y-4">
                <div className="bg-blue-950/40 border border-blue-500/30 p-4 rounded-xl text-xs text-blue-300">
                  ⚠️ <strong>Conductor 2:</strong> Puedes ingresar tus gastos usando el botón rojo superior.
                </div>
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <h3 className="font-bold text-sm mb-3">Historial de Gastos Asignados</h3>
                  <div className="space-y-2">
                    {monthlyMovements.filter(m => m.type === 'expense' && (m.driverName?.includes('Conductor 2') || m.createdBy?.includes('Dispositivo 4'))).map(item => (
                      <div key={item.id} className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                        <div>
                          <span className="font-bold text-white text-xs">{item.category}</span>
                          <p className="text-[11px] text-slate-400">{item.description}</p>
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="font-bold text-rose-400">{formatMoney(item.amount)}</span>
                          <button onClick={() => handleDelete(item.id)} className="text-slate-500 hover:text-rose-400"><Trash2 /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              /* VISTA GENERAL / ROLES 1, 2 Y 3 */
              <div className="space-y-6">
                
                {/* TARJETAS DE INDICADORES FINANCIEROS */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Total Fletes</span>
                    <p className="text-xl font-bold text-emerald-400 mt-1">{formatMoney(metrics.totalFreights)}</p>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Total Gastos</span>
                    <p className="text-xl font-bold text-rose-400 mt-1">{formatMoney(metrics.totalExpenses)}</p>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Utilidad Neta Total</span>
                    <p className="text-xl font-bold text-white mt-1">{formatMoney(metrics.netTotal)}</p>
                  </div>
                </div>

                {/* BENEFICIOS 50% CON NOMBRES EMES Y PELAO */}
                {activeDeviceObj.roleKey === 'driver1' && (
                  <div className="bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-2xl shadow-lg">
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">50% EMES</span>
                    <p className="text-3xl font-black text-emerald-300 mt-1">{formatMoney(metrics.driver1Share)}</p>
                  </div>
                )}

                {activeDeviceObj.roleKey === 'owner' && (
                  <div className="bg-amber-950/30 border border-amber-500/40 p-4 rounded-2xl shadow-lg">
                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">50% PELAO</span>
                    <p className="text-3xl font-black text-amber-300 mt-1">{formatMoney(metrics.ownerShare)}</p>
                  </div>
                )}

                {activeDeviceObj.roleKey === 'admin' && (
                  <div className="bg-purple-950/30 border border-purple-500/40 p-4 rounded-2xl shadow-lg grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">50% EMES</span>
                      <p className="text-2xl font-black text-emerald-300 mt-1">{formatMoney(metrics.driver1Share)}</p>
                    </div>
                    <div>
                      <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">50% PELAO</span>
                      <p className="text-2xl font-black text-amber-300 mt-1">{formatMoney(metrics.ownerShare)}</p>
                    </div>
                  </div>
                )}

                {/* CONTROL DE FACTURACIÓN */}
                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-sm text-white flex items-center gap-2">
                      <FileText /> Estado de Facturación y Cobros
                    </h3>
                    <div className="flex gap-4 text-xs">
                      <span className="text-amber-400 font-bold">Emitidas / Por Cobrar: {formatMoney(metrics.totalIssuedInvoices)}</span>
                      <span className="text-emerald-400 font-bold">Facturas Pagadas: {formatMoney(metrics.totalPaidInvoices)}</span>
                    </div>
                  </div>

                  {/* LISTADO CON CONTROL DE FACTURAS */}
                  <div className="space-y-2">
                    {monthlyMovements.map(item => (
                      <div key={item.id} className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className={`font-bold text-sm ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {item.type === 'freight' ? `Flete: ${item.client}` : `Gasto: ${item.category}`}
                            </span>
                            <span className="text-slate-500">• {item.date}</span>
                          </div>
                          <p className="text-slate-400 mt-0.5">{item.type === 'freight' ? `${item.origin} ➔ ${item.destination}` : item.description}</p>
                        </div>

                        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                          {item.type === 'freight' && (
                            <select
                              value={item.invoicingStatus || 'No Facturado'}
                              onChange={(e) => handleInvoiceStatusChange(item.id, e.target.value)}
                              className={`text-xs font-bold border rounded-lg px-2.5 py-1 focus:outline-none cursor-pointer ${
                                item.invoicingStatus === 'Factura Pagada' ? 'bg-emerald-950 border-emerald-500 text-emerald-300' :
                                item.invoicingStatus === 'Factura Emitida (Pendiente)' ? 'bg-amber-950 border-amber-500 text-amber-300' :
                                'bg-slate-900 border-slate-700 text-slate-300'
                              }`}
                            >
                              {INVOICE_STATUSES.map(st => <option key={st} value={st}>{st}</option>)}
                            </select>
                          )}

                          <span className={`font-bold text-sm ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {item.type === 'freight' ? '+' : '-'}{formatMoney(item.amount)}
                          </span>

                          <button onClick={() => handleDelete(item.id)} className="text-slate-500 hover:text-rose-400 p-1"><Trash2 /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}
          </main>

          {/* MODAL INGRESAR FLETE */}
          {isFreightModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-white">Ingresar Nuevo Flete</h3>
                <form onSubmit={handleSaveFreight} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Cliente *</label>
                    <input type="text" required value={freightForm.client} onChange={e => setFreightForm({...freightForm, client: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" placeholder="Ej: Agrotech Chile" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Origen</label>
                      <input type="text" value={freightForm.origin} onChange={e => setFreightForm({...freightForm, origin: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" placeholder="Santiago" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Destino</label>
                      <input type="text" value={freightForm.destination} onChange={e => setFreightForm({...freightForm, destination: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" placeholder="Valparaíso" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Monto CLP *</label>
                      <input type="number" required value={freightForm.amount} onChange={e => setFreightForm({...freightForm, amount: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-emerald-400 font-bold" placeholder="300000" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Fecha</label>
                      <input type="date" value={freightForm.date} onChange={e => setFreightForm({...freightForm, date: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Estado Inicial de Factura</label>
                    <select value={freightForm.invoicingStatus} onChange={e => setFreightForm({...freightForm, invoicingStatus: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                      {INVOICE_STATUSES.map(st => <option key={st} value={st}>{st}</option>)}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setIsFreightModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl">Guardar Flete</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL INGRESAR GASTO */}
          {isExpenseModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-white">Ingresar Nuevo Gasto Operativo</h3>
                <form onSubmit={handleSaveExpense} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Categoría</label>
                    <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                      {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Descripción Breve *</label>
                    <input type="text" required value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" placeholder="Ej: Peajes Ruta 68 / Carga Diésel" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Monto CLP *</label>
                      <input type="number" required value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-rose-400 font-bold" placeholder="50000" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Fecha</label>
                      <input type="date" value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl">Guardar Gasto</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
```eof

### Cambios realizados:
1. **Dispositivo 1**: Actualizado a **Emes** (`50% EMES`).
2. **Dispositivo 2**: Actualizado a **Pelao** (`50% PELAO`).
3. **Selector de Dispositivos y Vista del Administrador**: Muestra claramente el reparto 50/50 entre **Emes** y **Pelao**.
