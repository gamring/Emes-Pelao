<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Fletes y Servicios - Emes&Pelao</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    // --- ICONOS SVG EN LÍNEA ---
    const Truck = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-5 h-5' },
      h('path', { d: 'M14 18H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v10' }),
      h('path', { d: 'M14 10h4l4 4v4H14v-8z' }),
      h('circle', { cx: '7.5', cy: '18.5', r: '2.5' }),
      h('circle', { cx: '18.5', cy: '18.5', r: '2.5' })
    );

    const Lock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('rect', { x: '3', y: '11', width: '18', height: '11', rx: '2', ry: '2' }),
      h('path', { d: 'M7 11V7a5 5 0 0 1 10 0v4' })
    );

    const Clock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-5 h-5' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('polyline', { points: '12 6 12 12 16 14' })
    );

    const FileText = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z' }),
      h('polyline', { points: '14 2 14 8 20 8' }),
      h('line', { x1: '16', y1: '13', x2: '8', y2: '13' }),
      h('line', { x1: '16', y1: '17', x2: '8', y2: '17' }),
      h('polyline', { points: '10 9 9 9 8 9' })
    );

    const PlusCircle = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('line', { x1: '12', y1: '8', x2: '12', y2: '16' }),
      h('line', { x1: '8', y1: '12', x2: '16', y2: '12' })
    );

    const Camera = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z' }),
      h('circle', { cx: '12', cy: '13', r: '4' })
    );

    const Trash2 = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('polyline', { points: '3 6 5 6 21 6' }),
      h('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' }),
      h('line', { x1: '10', y1: '11', x2: '10', y2: '17' }),
      h('line', { x1: '14', y1: '11', x2: '14', y2: '17' })
    );

    const LogOut = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4' }),
      h('polyline', { points: '16 17 21 12 16 7' }),
      h('line', { x1: '21', y1: '12', x2: '9', y2: '12' })
    );

    const Edit = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7' }),
      h('path', { d: 'M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z' })
    );

    const Key = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4' })
    );

    const Shield = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' })
    );

    const X = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('line', { x1: '18', y1: '6', x2: '6', y2: '18' }),
      h('line', { x1: '6', y1: '6', x2: '18', y2: '18' })
    );

    const Download = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2.5', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }),
      h('polyline', { points: '7 10 12 15 17 10' }),
      h('line', { x1: '12', y1: '15', x2: '12', y2: '3' })
    );

    // --- DATOS INICIALES ---
    const INITIAL_MOVEMENTS = [
      {
        id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central',
        destination: 'Valparaíso Puerto', amount: 300000, vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', date: '2026-10-25', invoicingStatus: 'Factura Pagada', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25',
        description: 'Carga Diésel Shell', vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua',
        destination: 'Coquimbo', amount: 480000, vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', date: '2026-10-27', invoicingStatus: 'No Facturado', createdBy: 'Dispositivo 4 - Conductor 2'
      },
      {
        id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27',
        description: 'Estación Copec', vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', createdBy: 'Dispositivo 4 - Conductor 2'
      }
    ];

    const DEFAULT_DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Emes', role: 'Emes (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Pelao', role: 'Pelao (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total & Facturación', defaultPin: '0000' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor Registro Gastos', defaultPin: '1234' }
    ];

    const DEFAULT_KPI_TITLES = {
      freights: 'TOTAL FLETES',
      expenses: 'TOTAL GASTOS',
      netProfit: 'UTILIDAD NETA TOTAL',
      emesShare: '50% EMES',
      pelaoShare: '50% PELAO'
    };

    function App() {
      const [movements, setMovements] = useState(() => {
        try {
          const saved = localStorage.getItem('fletes_movements');
          return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
        } catch (e) {
          return INITIAL_MOVEMENTS;
        }
      });

      const [devicePins, setDevicePins] = useState(() => {
        const initPins = {};
        DEFAULT_DEVICES.forEach(d => initPins[d.id] = d.defaultPin);
        try {
          const savedPins = localStorage.getItem('fletes_device_pins');
          if (savedPins) return { ...initPins, ...JSON.parse(savedPins) };
        } catch (e) {}
        return initPins;
      });

      const [kpiTitles, setKpiTitles] = useState(() => {
        try {
          const savedTitles = localStorage.getItem('fletes_kpi_titles');
          if (savedTitles) return JSON.parse(savedTitles);
        } catch (e) {}
        return DEFAULT_KPI_TITLES;
      });

      const [currentDevice, setCurrentDevice] = useState(DEFAULT_DEVICES[2].name);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('2026-10');

      const [isKeysModalOpen, setIsKeysModalOpen] = useState(false);
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [isFreightModalOpen, setIsFreightModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);

      const [editedPins, setEditedPins] = useState({});
      const [editedKpis, setEditedKpis] = useState({});

      const [freightForm, setFreightForm] = useState({
        client: '', origin: '', destination: '', amount: '',
        date: '2026-10-28',
        driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
        invoicingStatus: 'No Facturado'
      });

      const [expenseForm, setExpenseForm] = useState({
        category: 'Combustible', amount: '', description: '',
        date: '2026-10-28',
        driverName: 'Emes', receiptImage: null
      });

      const activeDeviceObj = useMemo(
        () => DEFAULT_DEVICES.find(d => d.name === currentDevice) || DEFAULT_DEVICES[2],
        [currentDevice]
      );

      useEffect(() => {
        try {
          localStorage.setItem('fletes_movements', JSON.stringify(movements));
          localStorage.setItem('fletes_device_pins', JSON.stringify(devicePins));
          localStorage.setItem('fletes_kpi_titles', JSON.stringify(kpiTitles));
        } catch (e) {}
      }, [movements, devicePins, kpiTitles]);

      const handleLogin = (e) => {
        e.preventDefault();
        const expectedPin = devicePins[activeDeviceObj.id] || activeDeviceObj.defaultPin;
        if (pinInput === expectedPin) {
          setIsAuthenticated(true);
          setLoginError('');
          setPinInput('');
          setEditedPins({ ...devicePins });
          setEditedKpis({ ...kpiTitles });
        } else {
          setLoginError('Clave incorrecta');
        }
      };

      const handleDeviceSwitch = (deviceName) => {
        setCurrentDevice(deviceName);
        setIsAuthenticated(false);
        setPinInput('');
        setLoginError('');
      };

      // Filtrado para Conductor 2
      const monthlyMovements = useMemo(() => {
        const filtered = movements.filter(m => m.date && m.date.startsWith(selectedMonth));
        if (activeDeviceObj.roleKey === 'driver2') {
          return filtered.filter(m => m.createdBy === activeDeviceObj.name && m.type === 'expense');
        }
        return filtered;
      }, [movements, selectedMonth, activeDeviceObj]);

      const metrics = useMemo(() => {
        let totalFreights = 0;
        let totalExpenses = 0;
        let netFreights = 0;

        let paidInvoices = 0;
        let pendingInvoices = 0;
        let unInvoiced = 0;

        monthlyMovements.forEach(m => {
          const amount = Number(m.amount) || 0;
          if (m.type === 'freight') {
            totalFreights += amount;
            
            if (m.invoicingStatus === 'Factura Pagada') {
              paidInvoices += amount;
              netFreights += Math.round(amount / 1.19);
            } else if (m.invoicingStatus === 'Factura Pendiente') {
              pendingInvoices += amount;
              netFreights += Math.round(amount / 1.19);
            } else {
              unInvoiced += amount;
              netFreights += amount;
            }
          } else {
            totalExpenses += amount;
          }
        });

        const totalCashIn = paidInvoices + unInvoiced; // Ingresos reales cobrados + no facturados
        const netTotal = netFreights - totalExpenses;
        const halfShare = netTotal > 0 ? netTotal * 0.5 : 0;

        return {
          totalFreights, totalExpenses, netTotal,
          paidInvoices, pendingInvoices, unInvoiced, totalCashIn,
          ownerShare: halfShare, driver1Share: halfShare
        };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', {
        style: 'currency', currency: 'CLP', maximumFractionDigits: 0
      }).format(val);

      const handleDelete = (id) => {
        if (activeDeviceObj.roleKey !== 'admin') {
          alert('Solo el Administrador General puede eliminar registros.');
          return;
        }
        if (confirm('¿Deseas eliminar este registro? Esta acción no se puede deshacer.')) {
          setMovements(movements.filter(m => m.id !== id));
        }
      };

      // Exportar a Excel (CSV)
      const handleExportCSV = () => {
        if (monthlyMovements.length === 0) {
          alert('No hay movimientos registrados en este mes para exportar.');
          return;
        }

        const headers = ["ID", "Fecha", "Tipo", "Cliente / Categoria", "Origen", "Destino", "Monto CLP", "Estado Facturacion", "Registrado Por"];
        const rows = monthlyMovements.map(m => [
          m.id,
          m.date,
          m.type === 'freight' ? 'Flete' : 'Gasto',
          m.type === 'freight' ? `"${m.client}"` : `"${m.category} - ${m.description}"`,
          m.origin ? `"${m.origin}"` : '-',
          m.destination ? `"${m.destination}"` : '-',
          m.amount,
          m.invoicingStatus || '-',
          `"${m.createdBy || 'Sistema'}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
          + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Reporte_Emes_Pelao_${selectedMonth}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleSaveKeys = (e) => {
        e.preventDefault();
        setDevicePins(editedPins);
        setIsKeysModalOpen(false);
      };

      const handleSaveKpis = (e) => {
        e.preventDefault();
        setKpiTitles(editedKpis);
        setIsKpiModalOpen(false);
      };

      const handleSaveFreight = (e) => {
        e.preventDefault();
        if (!freightForm.client || !freightForm.amount) return;

        const newItem = {
          id: `fl-${Date.now().toString().slice(-4)}`,
          type: 'freight',
          ...freightForm,
          amount: Number(freightForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsFreightModalOpen(false);
        setFreightForm({
          client: '', origin: '', destination: '', amount: '',
          date: '2026-10-28',
          driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
          invoicingStatus: 'No Facturado'
        });
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.amount || !expenseForm.description) return;

        const newItem = {
          id: `exp-${Date.now().toString().slice(-4)}`,
          type: 'expense',
          ...expenseForm,
          amount: Number(expenseForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsExpenseModalOpen(false);
        setExpenseForm({
          category: 'Combustible', amount: '', description: '',
          date: '2026-10-28',
          driverName: activeDeviceObj.roleKey === 'driver2' ? 'Conductor 2' : 'Emes', 
          receiptImage: null
        });
      };

      // --- LOGIN ---
      if (!isAuthenticated) {
        return h('div', {
          className: 'min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4'
        },
          h('div', {
            className: 'max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 text-center shadow-2xl'
          },
            h('div', {
              className: 'w-12 h-12 bg-slate-800 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400'
            }, h(Lock)),
            h('div', null,
              h('h2', { className: 'text-base font-extrabold text-white tracking-wide' }, currentDevice),
              h('p', { className: 'text-xs text-slate-400 mt-1 font-medium' }, 'Ingresa tu clave de acceso')
            ),
            h('form', { onSubmit: handleLogin, className: 'space-y-4' },
              h('input', {
                type: 'password', maxLength: 10, required: true, autoFocus: true,
                placeholder: 'Ingresa PIN / Clave', value: pinInput,
                onChange: (e) => setPinInput(e.target.value),
                className: 'w-full text-center bg-slate-950 border border-slate-700 rounded-xl py-3 text-lg font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 tracking-widest'
              }),
              loginError && h('p', { className: 'text-xs text-rose-400 font-bold' }, loginError),
              h('button', {
                type: 'submit',
                className: 'w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs uppercase tracking-wider text-white transition-all'
              }, 'Ingresar al Sistema')
            ),
            h('div', { className: 'pt-4 border-t border-slate-800' },
              h('p', { className: 'text-[11px] text-slate-400 mb-2 font-bold' }, '¿Cambiar de dispositivo?'),
              h('select', {
                value: currentDevice,
                onChange: (e) => handleDeviceSwitch(e.target.value),
                className: 'bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2 focus:outline-none w-full cursor-pointer'
              }, DEFAULT_DEVICES.map(d => d.name).map(n => h('option', { key: n, value: n }, n)))
            )
          )
        );
      }

      // --- DASHBOARD ---
      return h('div', { className: 'min-h-screen bg-slate-950 text-slate-100 pb-20 font-sans' },
        h('header', { className: 'bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-lg' },
          h('div', { className: 'max-w-6xl mx-auto flex justify-between items-center gap-3' },
            h('div', { className: 'flex items-center gap-2.5' },
              h('div', { className: 'p-2.5 bg-emerald-600 text-white rounded-xl shadow-lg' }, h(Truck)),
              h('div', null,
                h('h1', { className: 'font-black text-xl tracking-tight text-white' }, 'Emes&Pelao'),
                h('p', { className: 'text-[10px] text-emerald-400 font-extrabold uppercase tracking-widest' }, 'Gestión de Fletes y Servicios')
              )
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('span', { className: 'hidden md:inline text-xs text-emerald-400 bg-slate-800 border border-slate-700 px-3.5 py-1.5 rounded-xl font-extrabold' }, activeDeviceObj.name),
              h('button', { onClick: () => setIsAuthenticated(false), className: 'p-2.5 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl border border-slate-700 shadow transition-all', title: 'Cerrar sesión' }, h(LogOut))
            )
          )
        ),
        h('main', { className: 'max-w-6xl mx-auto p-4 space-y-6' },
          h('div', { className: 'bg-slate-900 p-4.5 rounded-2xl border border-slate-800 flex flex-col lg:flex-row justify-between items-center gap-4 shadow-xl' },
            h('div', { className: 'flex items-center gap-3 w-full lg:w-auto' },
              h('div', { className: 'text-slate-400' }, h(Clock)),
              h('span', { className: 'text-xs text-slate-300 font-bold uppercase tracking-wider' }, 'Mes de Consulta:'),
              h('input', { type: 'month', value: selectedMonth, onChange: (e) => setSelectedMonth(e.target.value), className: 'bg-slate-800 border border-slate-700 px-3.5 py-2 rounded-xl text-xs font-black text-white focus:outline-none focus:border-emerald-500 cursor-pointer' })
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2.5 w-full lg:w-auto' },
              h('button', { onClick: handleExportCSV, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-emerald-500/50 text-emerald-400 font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow' }, h(Download), 'Exportar Excel'),
              activeDeviceObj.roleKey === 'admin' && [
                h('button', { key: 'btn-kpi', onClick: () => { setEditedKpis({ ...kpiTitles }); setIsKpiModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-purple-500/50 text-purple-300 font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow' }, h(Edit), 'Nombres KPI'),
                h('button', { key: 'btn-keys', onClick: () => { setEditedPins({ ...devicePins }); setIsKeysModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-amber-500/50 text-amber-300 font-extrabold text-xs px-4 py-2.5 rounded-xl transition shadow' }, h(Key), 'Control Claves')
              ],
