<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Fletes y Servicios</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM (Versión de producción ultra compatible) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    // --- ICONOS SVG EN LÍNEA (EVITA FALLOS DE LIBRERÍAS EXTERNAS) ---
    const Truck = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-5 h-5' },
      h('path', { d: 'M14 18H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v10' }),
      h('path', { d: 'M14 10h4l4 4v4H14v-8z' }),
      h('circle', { cx: '7.5', cy: '18.5', r: '2.5' }),
      h('circle', { cx: '18.5', cy: '18.5', r: '2.5' })
    );

    const Lock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('rect', { x: '3', y: '11', width: '18', height: '11', rx: '2', ry: '2' }),
      h('path', { d: 'M7 11V7a5 5 0 0 1 10 0v4' })
    );

    const Clock = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-5 h-5' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('polyline', { points: '12 6 12 12 16 14' })
    );

    const FileText = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z' }),
      h('polyline', { points: '14 2 14 8 20 8' }),
      h('line', { x1: '16', y1: '13', x2: '8', y2: '13' }),
      h('line', { x1: '16', y1: '17', x2: '8', y2: '17' }),
      h('polyline', { points: '10 9 9 9 8 9' })
    );

    const PlusCircle = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('circle', { cx: '12', cy: '12', r: '10' }),
      h('line', { x1: '12', y1: '8', x2: '12', y2: '16' }),
      h('line', { x1: '8', y1: '12', x2: '16', y2: '12' })
    );

    const Camera = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z' }),
      h('circle', { cx: '12', cy: '13', r: '4' })
    );

    const Trash2 = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-3.5 h-3.5' },
      h('polyline', { points: '3 6 5 6 21 6' }),
      h('path', { d: 'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' }),
      h('line', { x1: '10', y1: '11', x2: '10', y2: '17' }),
      h('line', { x1: '14', y1: '11', x2: '14', y2: '17' })
    );

    const LogOut = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4' }),
      h('polyline', { points: '16 17 21 12 16 7' }),
      h('line', { x1: '21', y1: '12', x2: '9', y2: '12' })
    );

    const Edit = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7' }),
      h('path', { d: 'M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z' })
    );

    const Key = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4' })
    );

    const Shield = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('path', { d: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' })
    );

    const X = () => h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round', className: 'w-4 h-4' },
      h('line', { x1: '18', y1: '6', x2: '6', y2: '18' }),
      h('line', { x1: '6', y1: '6', x2: '18', y2: '18' })
    );

    // --- DATOS INICIALES ---
    const INITIAL_MOVEMENTS = [
      {
        id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central',
        destination: 'Valparaíso Puerto', amount: 300000, vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', date: '2026-10-25', invoicingStatus: 'Factura Pagada',
        vatApplicable: true, createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25',
        description: 'Carga Diésel Shell', vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua',
        destination: 'Coquimbo', amount: 480000, vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', date: '2026-10-27', invoicingStatus: 'No Facturado',
        vatApplicable: false, createdBy: 'Dispositivo 4 - Conductor 2'
      },
      {
        id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27',
        description: 'Estación Copec', vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', createdBy: 'Dispositivo 4 - Conductor 2'
      }
    ];

    const DEFAULT_DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Emes', role: 'Emes (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Pelao', role: 'Pelao (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total & Facturación', defaultPin: '0000' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor Registro Gastos', defaultPin: '1234' }
    ];

    const DEFAULT_KPI_TITLES = {
      freights: 'TOTAL FLETES',
      expenses: 'TOTAL GASTOS',
      netProfit: 'UTILIDAD NETA TOTAL',
      emesShare: '50% EMES',
      pelaoShare: '50% PELAO'
    };

    function App() {
      // Intentos de recuperación de datos seguros de localStorage
      const [movements, setMovements] = useState(() => {
        try {
          const saved = localStorage.getItem('fletes_movements');
          return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
        } catch (e) {
          return INITIAL_MOVEMENTS;
        }
      });

      const [devicePins, setDevicePins] = useState(() => {
        const initPins = {};
        DEFAULT_DEVICES.forEach(d => initPins[d.id] = d.defaultPin);
        try {
          const savedPins = localStorage.getItem('fletes_device_pins');
          if (savedPins) return { ...initPins, ...JSON.parse(savedPins) };
        } catch (e) {}
        return initPins;
      });

      const [kpiTitles, setKpiTitles] = useState(() => {
        try {
          const savedTitles = localStorage.getItem('fletes_kpi_titles');
          if (savedTitles) return JSON.parse(savedTitles);
        } catch (e) {}
        return DEFAULT_KPI_TITLES;
      });

      const [currentDevice, setCurrentDevice] = useState(DEFAULT_DEVICES[2].name);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('2026-10');

      const [isKeysModalOpen, setIsKeysModalOpen] = useState(false);
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [isFreightModalOpen, setIsFreightModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);

      const [editedPins, setEditedPins] = useState({});
      const [editedKpis, setEditedKpis] = useState({});

      const [freightForm, setFreightForm] = useState({
        client: '', origin: '', destination: '', amount: '',
        date: '2026-10-28',
        driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
        invoicingStatus: 'No Facturado', vatApplicable: false
      });

      const [expenseForm, setExpenseForm] = useState({
        category: 'Combustible', amount: '', description: '',
        date: '2026-10-28',
        driverName: 'Emes', receiptImage: null, vatCreditEligible: false
      });

      const activeDeviceObj = useMemo(
        () => DEFAULT_DEVICES.find(d => d.name === currentDevice) || DEFAULT_DEVICES[2],
        [currentDevice]
      );

      // Sincronización persistente
      useEffect(() => {
        try {
          localStorage.setItem('fletes_movements', JSON.stringify(movements));
          localStorage.setItem('fletes_device_pins', JSON.stringify(devicePins));
          localStorage.setItem('fletes_kpi_titles', JSON.stringify(kpiTitles));
        } catch (e) {}
      }, [movements, devicePins, kpiTitles]);

      const handleLogin = (e) => {
        e.preventDefault();
        const expectedPin = devicePins[activeDeviceObj.id] || activeDeviceObj.defaultPin;
        if (pinInput === expectedPin) {
          setIsAuthenticated(true);
          setLoginError('');
          setPinInput('');
          setEditedPins({ ...devicePins });
          setEditedKpis({ ...kpiTitles });
        } else {
          setLoginError('Clave incorrecta');
        }
      };

      const handleDeviceSwitch = (deviceName) => {
        setCurrentDevice(deviceName);
        setIsAuthenticated(false);
        setPinInput('');
        setLoginError('');
      };

      const monthlyMovements = useMemo(
        () => movements.filter(m => m.date && m.date.startsWith(selectedMonth)),
        [movements, selectedMonth]
      );

      const metrics = useMemo(() => {
        let totalFreights = 0;
        let totalExpenses = 0;

        monthlyMovements.forEach(m => {
          const amount = Number(m.amount) || 0;
          if (m.type === 'freight') {
            totalFreights += amount;
          } else {
            totalExpenses += amount;
          }
        });

        const netTotal = totalFreights - totalExpenses;
        const halfShare = netTotal > 0 ? netTotal * 0.5 : 0;

        return {
          totalFreights, totalExpenses, netTotal,
          ownerShare: halfShare, driver1Share: halfShare
        };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', {
        style: 'currency', currency: 'CLP', maximumFractionDigits: 0
      }).format(val);

      const handleDelete = (id) => {
        if (activeDeviceObj.roleKey !== 'admin') {
          alert('Solo el Administrador General puede eliminar registros.');
          return;
        }
        if (confirm('¿Deseas eliminar este registro? Esta acción no se puede deshacer.')) {
          setMovements(movements.filter(m => m.id !== id));
        }
      };

      const handleSaveKeys = (e) => {
        e.preventDefault();
        setDevicePins(editedPins);
        setIsKeysModalOpen(false);
      };

      const handleSaveKpis = (e) => {
        e.preventDefault();
        setKpiTitles(editedKpis);
        setIsKpiModalOpen(false);
      };

      const handleSaveFreight = (e) => {
        e.preventDefault();
        if (!freightForm.client || !freightForm.amount) return;

        const newItem = {
          id: `fl-${Date.now().toString().slice(-4)}`,
          type: 'freight',
          ...freightForm,
          amount: Number(freightForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsFreightModalOpen(false);
        setFreightForm({
          client: '', origin: '', destination: '', amount: '',
          date: '2026-10-28',
          driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
          invoicingStatus: 'No Facturado', vatApplicable: false
        });
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.amount || !expenseForm.description) return;

        const newItem = {
          id: `exp-${Date.now().toString().slice(-4)}`,
          type: 'expense',
          ...expenseForm,
          amount: Number(expenseForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsExpenseModalOpen(false);
        setExpenseForm({
          category: 'Combustible', amount: '', description: '',
          date: '2026-10-28',
          driverName: 'Emes', receiptImage: null, vatCreditEligible: false
        });
      };

      // --- VISTA PANTALLA DE LOGUEO ---
      if (!isAuthenticated) {
        return h('div', {
          className: 'min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4'
        },
          h('div', {
            className: 'max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 text-center shadow-2xl'
          },
            h('div', {
              className: 'w-12 h-12 bg-emerald-950 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400'
            }, h(Lock)),
            h('div', null,
              h('h2', { className: 'text-base font-bold text-white' }, currentDevice),
              h('p', { className: 'text-xs text-slate-400 mt-1' }, 'Ingresa tu clave de acceso')
            ),
            h('form', { onSubmit: handleLogin, className: 'space-y-4' },
              h('input', {
                type: 'password', maxLength: 10, required: true, autoFocus: true,
                placeholder: 'Ingresa PIN / Clave', value: pinInput,
                onChange: (e) => setPinInput(e.target.value),
                className: 'w-full text-center bg-slate-950 border border-slate-800 rounded-xl py-3 text-lg font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 tracking-widest'
              }),
              loginError && h('p', { className: 'text-xs text-rose-400 font-bold' }, loginError),
              h('button', {
                type: 'submit',
                className: 'w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs uppercase tracking-wider text-white transition'
              }, 'Ingresar a Dispositivo')
            ),
            h('div', { className: 'pt-4 border-t border-slate-800/60' },
              h('p', { className: 'text-[11px] text-slate-400 mb-2 font-medium' }, '¿Cambiar de dispositivo?'),
              h('select', {
                value: currentDevice,
                onChange: (e) => handleDeviceSwitch(e.target.value),
                className: 'bg-slate-855 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2 focus:outline-none w-full'
              }, DEFAULT_DEVICES.map(d => h('option', { key: d.id, value: d.name }, d.name)))
            )
          )
        );
      }

      // --- VISTA DASHBOARD PRINCIPAL ---
      return h('div', { className: 'min-h-screen bg-slate-955 text-slate-100 pb-20' },
        h('header', { className: 'bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 shadow-md' },
          h('div', { className: 'max-w-5xl mx-auto flex justify-between items-center gap-3' },
            h('div', { className: 'flex items-center gap-2' },
              h('div', { className: 'p-2 bg-emerald-600 rounded-xl shadow-lg shadow-emerald-700/20' }, h(Truck)),
              h('div', null,
                h('h1', { className: 'font-extrabold text-lg tracking-tight' }, 'FletesSync'),
                h('p', { className: 'text-[9px] text-emerald-400 font-bold uppercase tracking-wider' }, 'Gestión de Fletes y Servicios')
              )
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('span', { className: 'hidden md:inline text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-900/60 px-3 py-1.5 rounded-xl font-bold' }, activeDeviceObj.name),
              h('button', { onClick: () => setIsAuthenticated(false), className: 'p-2 bg-slate-800 hover:bg-slate-750 text-rose-450 rounded-xl border border-slate-700 shadow transition-colors duration-200', title: 'Cerrar sesión' }, h(LogOut))
            )
          )
        ),
        h('main', { className: 'max-w-5xl mx-auto p-4 space-y-6' },
          h('div', { className: 'bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4 shadow' },
            h('div', { className: 'flex items-center gap-2.5' },
              h('div', { className: 'text-slate-405' }, h(Clock)),
              h('span', { className: 'text-xs text-slate-400 font-bold uppercase tracking-wider' }, 'Mes de Consulta:'),
              h('input', { type: 'month', value: selectedMonth, onChange: (e) => setSelectedMonth(e.target.value), className: 'bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-extrabold text-white focus:outline-none focus:border-emerald-500 cursor-pointer' })
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2 w-full sm:w-auto' },
              activeDeviceObj.roleKey === 'admin' && [
                h('button', { key: 'btn-kpi', onClick: () => { setEditedKpis({ ...kpiTitles }); setIsKpiModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-purple-950/60 hover:bg-purple-900 border border-purple-500/30 text-purple-200 font-bold text-xs px-3.5 py-2 rounded-xl transition' }, h(Edit), 'Nombres KPI'),
                h('button', { key: 'btn-keys', onClick: () => { setEditedPins({ ...devicePins }); setIsKeysModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-amber-950/60 hover:bg-amber-900 border border-amber-500/30 text-amber-200 font-bold text-xs px-3.5 py-2 rounded-xl transition' }, h(Key), 'Control Claves')
              ],
              activeDeviceObj.roleKey !== 'driver2' && h('button', { onClick: () => setIsFreightModalOpen(true), className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-550 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow shadow-emerald-655/15 transition' }, h(PlusCircle), '+ Flete'),
              h('button', { onClick: () => setIsExpenseModalOpen(true), className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-550 text-white font-extrabold text-xs px-4 py-2.5 rounded-xl shadow shadow-rose-655/15 transition' }, h(Camera), '+ Gasto')
            )
          ),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4' },
            h('div', { className: 'bg-slate-905 p-5 rounded-2xl border border-slate-800 shadow' },
              h('span', { className: 'text-[10px] text-slate-400 font-extrabold uppercase tracking-widest' }, kpiTitles.freights),
              h('p', { className: 'text-2xl font-black text-emerald-400 mt-1 tracking-tight' }, formatMoney(metrics.totalFreights))
            ),
            h('div', { className: 'bg-slate-905 p-5 rounded-2xl border border-slate-800 shadow' },
              h('span', { className: 'text-[10px] text-slate-400 font-extrabold uppercase tracking-widest' }, kpiTitles.expenses),
              h('p', { className: 'text-2xl font-black text-rose-455 mt-1 tracking-tight' }, formatMoney(metrics.totalExpenses))
            ),
            h('div', { className: 'bg-slate-905 p-5 rounded-2xl border border-slate-800 shadow' },
              h('span', { className: 'text-[10px] text-slate-400 font-extrabold uppercase tracking-widest' }, kpiTitles.netProfit),
              h('p', { className: 'text-2xl font-black text-white mt-1 tracking-tight' }, formatMoney(metrics.netTotal))
            )
          ),
          activeDeviceObj.roleKey === 'driver1' && h('div', { className: 'bg-emerald-950/25 border border-emerald-500/20 p-5 rounded-2xl shadow-lg' },
            h('span', { className: 'text-[10px] font-black text-emerald-400 uppercase tracking-wider' }, kpiTitles.emesShare),
            h('p', { className: 'text-3xl font-black text-emerald-300 mt-1.5' }, formatMoney(metrics.driver1Share))
          ),
          activeDeviceObj.roleKey === 'owner' && h('div', { className: 'bg-amber-950/25 border border-amber-500/20 p-5 rounded-2xl shadow-lg' },
            h('span', { className: 'text-[10px] font-black text-amber-450 uppercase tracking-wider' }, kpiTitles.pelaoShare),
            h('p', { className: 'text-3xl font-black text-amber-300 mt-1.5' }, formatMoney(metrics.ownerShare))
          ),
          activeDeviceObj.roleKey === 'admin' && h('div', { className: 'bg-purple-950/15 border border-purple-500/20 p-5 rounded-2xl shadow grid grid-cols-1 sm:grid-cols-2 gap-4' },
            h('div', null,
              h('span', { className: 'text-[10px] font-black text-emerald-400 uppercase tracking-wider' }, kpiTitles.emesShare),
              h('p', { className: 'text-3xl font-black text-emerald-300 mt-1 tracking-tight' }, formatMoney(metrics.driver1Share))
            ),
            h('div', null,
              h('span', { className: 'text-[10px] font-black text-amber-450 uppercase tracking-wider' }, kpiTitles.pelaoShare),
              h('p', { className: 'text-3xl font-black text-amber-300 mt-1 tracking-tight' }, formatMoney(metrics.ownerShare))
            )
          ),
          h('div', { className: 'bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-4 shadow' },
            h('h3', { className: 'font-bold text-sm text-white flex items-center gap-2 border-b border-slate-800/80 pb-3' }, h(FileText), 'Movimientos del Mes Registrados'),
            h('div', { className: 'space-y-2' },
              monthlyMovements.length === 0 ? h('p', { className: 'text-xs text-slate-500 py-6 text-center' }, 'No existen movimientos registrados para el mes seleccionado.') :
              monthlyMovements.map(item => h('div', { key: item.id, className: 'bg-slate-950 p-4 rounded-xl border border-slate-800/80 flex justify-between items-center text-xs gap-3 hover:border-slate-700/60 transition-colors' },
                h('div', { className: 'space-y-0.5' },
                  h('p', { className: `font-extrabold text-[13px] ${item.type === 'freight' ? 'text-emerald-450' : 'text-rose-455'}` }, item.type === 'freight' ? `Flete: ${item.client}` : `Gasto: ${item.category}`),
                  h('p', { className: 'text-slate-400 text-[11px] font-medium' }, item.type === 'freight' ? `${item.origin} ➔ ${item.destination}` : item.description),
                  h('span', { className: 'text-slate-500 text-[10px] font-medium block pt-1' }, `${item.date} • Dispositivo: ${item.createdBy || 'Sistema'}`)
                ),
                h('div', { className: 'flex items-center gap-3 shrink-0' },
                  h('span', { className: `font-black text-[13px] ${item.type === 'freight' ? 'text-emerald-450' : 'text-rose-455'}` }, `${item.type === 'freight' ? '+' : '-'}${formatMoney(item.amount)}`),
                  h('button', { onClick: () => handleDelete(item.id), className: 'text-slate-500 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-900 transition-colors', title: 'Eliminar Registro' }, h(Trash2))
                )
              ))
            )
          )
        ),

        // --- VENTANAS MODAL (ADMIN CLAVES) ---
        isKeysModalOpen && h('div', { className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 animate-fade-in' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-850 pb-2' },
              h('h3', { className: 'font-extrabold text-sm text-white flex items-center gap-2' }, h(Shield), 'Administrar Claves de Acceso'),
              h('button', { onClick: () => setIsKeysModalOpen(false), className: 'text-slate-400 hover:text-white p-1 rounded-lg' }, h(X))
            ),
            h('form', { onSubmit: handleSaveKeys, className: 'space-y-3.5 text-xs' },
              DEFAULT_DEVICES.map(dev => h('div', { key: dev.id, className: 'bg-slate-955 p-3.5 rounded-xl border border-slate-800 space-y-1' },
                h('span', { className: 'font-extrabold text-slate-200 block' }, dev.name),
                h('p', { className: 'text-[10px] text-slate-400 font-medium pb-1.5' }, dev.role),
                h('div', { className: 'flex items-center gap-2' },
                  h('label', { className: 'text-slate-400 text-[11px] font-bold' }, 'Clave / PIN:'),
                  h('input', {
                    type: 'text', maxLength: 10, required: true,
                    value: editedPins[dev.id] || '',
                    onChange: (e) => setEditedPins({ ...editedPins, [dev.id]: e.target.value }),
                    className: 'bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-emerald-400 font-black text-center w-28 focus:outline-none focus:border-emerald-500'
                  })
                )
              )),
              h('div', { className: 'flex justify-end gap-2 pt-3 border-t border-slate-800/80' },
                h('button', { type: 'button', onClick: () => setIsKeysModalOpen(false), className: 'px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-750 font-bold' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2 bg-amber-600 hover:bg-amber-550 text-white font-extrabold rounded-xl shadow shadow-amber-655/20' }, 'Guardar Claves')
              )
            )
          )
        ),

        // --- VENTANAS MODAL (ADMIN KPIs) ---
        isKpiModalOpen && h('div', { className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 animate-fade-in' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-850 pb-2' },
              h('h3', { className: 'font-extrabold text-sm text-white flex items-center gap-2' }, h(Edit), 'Modificar Textos KPIs'),
              h('button', { onClick: () => setIsKpiModalOpen(false), className: 'text-slate-400 hover:text-white p-1' }, h(X))
            ),
            h('form', { onSubmit: handleSaveKpis, className: 'space-y-3.5 text-xs' },
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5 font-bold' }, 'Nombre para Total Fletes'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.freights || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, freights: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-850 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500 font-bold'
                })
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5 font-bold' }, 'Nombre para Total Gastos'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.expenses || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, expenses: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-850 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500 font-bold'
                })
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5 font-bold' }, 'Nombre para Utilidad Neta'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.netProfit || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, netProfit: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-850 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500 font-bold'
                })
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5 font-bold' }, 'Nombre para 50% Conductor 1'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.emesShare || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, emesShare: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-850 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500 font-bold'
                })
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5 font-bold' }, 'Nombre para 50% Dueño'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.pelaoShare || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, pelaoShare: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-850 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500 font-bold'
                })
              ),
              h('div', { className: 'flex justify-end gap-2 pt-3 border-t border-slate-800/85' },
                h('button', { type: 'button', onClick: () => setIsKpiModalOpen(false), className: 'px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-750 font-bold' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2 bg-purple-600 hover:bg-purple-550 text-white font-extrabold rounded-xl shadow shadow-purple-655/20' }, 'Guardar Cambios')
              )
            )
          )
        ),

        // --- MODAL PARA INSERTAR FLETE ---
        isFreightModalOpen && h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-850 pb-2' },
              h('h3', { className: 'font-extrabold text-sm text-white' }, 'Ingresar Nuevo Flete'),
              h('button', { onClick: () => setIsFreightModalOpen(false), className: 'text-slate-400 p-1 hover:text-white' }, h(X))
            ),
            h('form', { onSubmit: handleSaveFreight, className: 'space-y-3 text-xs' },
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Cliente / Contratante *'),
                h('input', { type: 'text', required: true, value: freightForm.client, onChange: e => setFreightForm({ ...freightForm, client: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500' })
              ),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Origen'),
                  h('input', { type: 'text', value: freightForm.origin, onChange: e => setFreightForm({ ...freightForm, origin: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500', placeholder: 'Punto partida' })
                ),
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Destino'),
                  h('input', { type: 'text', value: freightForm.destination, onChange: e => setFreightForm({ ...freightForm, destination: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-500', placeholder: 'Punto llegada' })
                )
              ),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Monto CLP *'),
                  h('input', { type: 'number', required: true, value: freightForm.amount, onChange: e => setFreightForm({ ...freightForm, amount: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-emerald-400 font-extrabold focus:outline-none focus:border-emerald-555' })
                ),
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Fecha'),
                  h('input', { type: 'date', value: freightForm.date, onChange: e => setFreightForm({ ...freightForm, date: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-emerald-555' })
                )
              ),
              h('div', { className: 'flex justify-end gap-2 pt-4 border-t border-slate-850' },
                h('button', { type: 'button', onClick: () => setIsFreightModalOpen(false), className: 'px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold hover:bg-slate-750' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2 bg-emerald-600 text-white font-extrabold rounded-xl shadow shadow-emerald-655/20' }, 'Guardar Flete')
              )
            )
          )
        ),

        // --- MODAL PARA INSERTAR GASTO ---
        isExpenseModalOpen && h('div', { className: 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-850 pb-2' },
              h('h3', { className: 'font-extrabold text-sm text-white' }, 'Ingresar Gasto de Operación'),
              h('button', { onClick: () => setIsExpenseModalOpen(false), className: 'text-slate-400 p-1 hover:text-white' }, h(X))
            ),
            h('form', { onSubmit: handleSaveExpense, className: 'space-y-3 text-xs' },
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Categoría del Gasto'),
                h('select', { value: expenseForm.category, onChange: e => setExpenseForm({ ...expenseForm, category: e.target.value }), className: 'w-full bg-slate-955 border border-slate-800 rounded-xl p-2.5 text-white font-bold' },
                  ['Combustible', 'Viáticos', 'Peajes', 'Reparaciones'].map(c => h('option', { key: c, value: c }, c))
                )
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Descripción Breve *'),
                h('input', { type: 'text', required: true, value: expenseForm.description, onChange: e => setExpenseForm({ ...expenseForm, description: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-500', placeholder: 'Ej: Carga Diésel Shell / Peajes' })
              ),
              h('div', { className: 'grid grid-cols-2 gap-2' },
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Monto CLP *'),
                  h('input', { type: 'number', required: true, value: expenseForm.amount, onChange: e => setExpenseForm({ ...expenseForm, amount: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-rose-400 font-extrabold focus:outline-none focus:border-rose-555' })
                ),
                h('div', null,
                  h('label', { className: 'text-slate-400 block mb-1 font-bold' }, 'Fecha'),
                  h('input', { type: 'date', value: expenseForm.date, onChange: e => setExpenseForm({ ...expenseForm, date: e.target.value }), className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-rose-555' })
                )
              ),
              h('div', { className: 'flex justify-end gap-2 pt-4 border-t border-slate-855' },
                h('button', { type: 'button', onClick: () => setIsExpenseModalOpen(false), className: 'px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold hover:bg-slate-750' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2 bg-rose-600 text-white font-extrabold rounded-xl shadow shadow-rose-655/20' }, 'Guardar Gasto')
              )
            )
          )
        )
      );
    }

    // --- MONTAJE UNIVERSAL DE REACT EN EL DOM ---
    const mountNode = document.getElementById('root');
    try {
      if (typeof ReactDOM.createRoot === 'function') {
        const root = ReactDOM.createRoot(mountNode);
        root.render(h(App));
      } else {
        ReactDOM.render(h(App), mountNode);
      }
    } catch (e) {
      // Fallback de contingencia técnica
      console.error('Fallo al montar la App:', e);
      ReactDOM.render(h(App), mountNode);
    }
  </script>
</body>
</html>
