<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Fletes y Servicios</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    // Componentes para íconos usando Lucide
    const Truck = () => h('i', { 'data-lucide': 'truck', className: 'w-5 h-5' });
    const Lock = () => h('i', { 'data-lucide': 'lock', className: 'w-4 h-4' });
    const Clock = () => h('i', { 'data-lucide': 'clock', className: 'w-5 h-5' });
    const FileText = () => h('i', { 'data-lucide': 'file-text', className: 'w-4 h-4' });
    const PlusCircle = () => h('i', { 'data-lucide': 'plus-circle', className: 'w-4 h-4' });
    const Camera = () => h('i', { 'data-lucide': 'camera', className: 'w-4 h-4' });
    const Trash2 = () => h('i', { 'data-lucide': 'trash-2', className: 'w-3.5 h-3.5' });
    const LogOut = () => h('i', { 'data-lucide': 'log-out', className: 'w-4 h-4' });
    const Edit = () => h('i', { 'data-lucide': 'edit-3', className: 'w-4 h-4' });
    const Key = () => h('i', { 'data-lucide': 'key', className: 'w-4 h-4' });
    const Shield = () => h('i', { 'data-lucide': 'shield', className: 'w-4 h-4' });
    const X = () => h('i', { 'data-lucide': 'x', className: 'w-4 h-4' });

    const INITIAL_MOVEMENTS = [
      {
        id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central',
        destination: 'Valparaíso Puerto', amount: 300000, vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', date: '2026-10-25', invoicingStatus: 'Factura Pagada',
        vatApplicable: true, createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25',
        description: 'Carga Diésel Shell', vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Emes', createdBy: 'Dispositivo 1 - Emes'
      },
      {
        id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua',
        destination: 'Coquimbo', amount: 480000, vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', date: '2026-10-27', invoicingStatus: 'No Facturado',
        vatApplicable: false, createdBy: 'Dispositivo 4 - Conductor 2'
      },
      {
        id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27',
        description: 'Estación Copec', vehicle: 'Mercedes-Benz Actros',
        driverName: 'Conductor 2', createdBy: 'Dispositivo 4 - Conductor 2'
      }
    ];

    const DEFAULT_DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Emes', role: 'Emes (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Pelao', role: 'Pelao (50% Beneficio Total)', defaultPin: '1234' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total & Facturación', defaultPin: '0000' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor Registro Gastos', defaultPin: '1234' }
    ];

    const DEFAULT_KPI_TITLES = {
      freights: 'TOTAL FLETES',
      expenses: 'TOTAL GASTOS',
      netProfit: 'UTILIDAD NETA TOTAL',
      emesShare: '50% EMES',
      pelaoShare: '50% PELAO'
    };

    function App() {
      const [movements, setMovements] = useState(() => {
        try {
          const saved = localStorage.getItem('fletes_movements');
          return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
        } catch (e) { return INITIAL_MOVEMENTS; }
      });

      const [devicePins, setDevicePins] = useState(() => {
        try {
          const savedPins = localStorage.getItem('fletes_device_pins');
          if (savedPins) return JSON.parse(savedPins);
        } catch (e) {}
        const initPins = {};
        DEFAULT_DEVICES.forEach(d => initPins[d.id] = d.defaultPin);
        return initPins;
      });

      const [kpiTitles, setKpiTitles] = useState(() => {
        try {
          const savedTitles = localStorage.getItem('fletes_kpi_titles');
          if (savedTitles) return JSON.parse(savedTitles);
        } catch (e) {}
        return DEFAULT_KPI_TITLES;
      });

      const [currentDevice, setCurrentDevice] = useState(DEFAULT_DEVICES[2].name);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('2026-10');

      const [isKeysModalOpen, setIsKeysModalOpen] = useState(false);
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [isFreightModalOpen, setIsFreightModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);

      const [editedPins, setEditedPins] = useState({ ...devicePins });
      const [editedKpis, setEditedKpis] = useState({ ...kpiTitles });

      const [freightForm, setFreightForm] = useState({
        client: '', origin: '', destination: '', amount: '',
        date: '2026-10-28',
        driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
        invoicingStatus: 'No Facturado', vatApplicable: false
      });

      const [expenseForm, setExpenseForm] = useState({
        category: 'Combustible', amount: '', description: '',
        date: '2026-10-28',
        driverName: 'Emes', receiptImage: null, vatCreditEligible: false
      });

      const activeDeviceObj = useMemo(
        () => DEFAULT_DEVICES.find(d => d.name === currentDevice) || DEFAULT_DEVICES[2],
        [currentDevice]
      );

      useEffect(() => {
        try {
          localStorage.setItem('fletes_movements', JSON.stringify(movements));
          localStorage.setItem('fletes_device_pins', JSON.stringify(devicePins));
          localStorage.setItem('fletes_kpi_titles', JSON.stringify(kpiTitles));
        } catch (e) {}

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }, [
        movements, devicePins, kpiTitles, currentDevice, isAuthenticated,
        isKeysModalOpen, isKpiModalOpen, isFreightModalOpen, isExpenseModalOpen
      ]);

      const handleLogin = (e) => {
        e.preventDefault();
        const expectedPin = devicePins[activeDeviceObj.id] || activeDeviceObj.defaultPin;
        if (pinInput === expectedPin) {
          setIsAuthenticated(true);
          setLoginError('');
          setPinInput('');
          setEditedPins({ ...devicePins });
          setEditedKpis({ ...kpiTitles });
        } else {
          setLoginError('Clave incorrecta');
        }
      };

      const handleDeviceSwitch = (deviceName) => {
        setCurrentDevice(deviceName);
        setIsAuthenticated(false);
        setPinInput('');
        setLoginError('');
      };

      const monthlyMovements = useMemo(
        () => movements.filter(m => m.date && m.date.startsWith(selectedMonth)),
        [movements, selectedMonth]
      );

      const metrics = useMemo(() => {
        let totalFreights = 0;
        let totalExpenses = 0;
        let netFreights = 0;
        let netExpenses = 0;

        monthlyMovements.forEach(m => {
          const amount = Number(m.amount) || 0;

          if (m.type === 'freight') {
            totalFreights += amount;
            netFreights += amount;
          } else {
            totalExpenses += amount;
            netExpenses += amount;
          }
        });

        const netTotal = netFreights - netExpenses;
        const halfShare = netTotal > 0 ? netTotal * 0.5 : 0;

        return {
          totalFreights, totalExpenses, netTotal,
          ownerShare: halfShare, driver1Share: halfShare
        };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', {
        style: 'currency', currency: 'CLP', maximumFractionDigits: 0
      }).format(val);

      const handleDelete = (id) => {
        if (activeDeviceObj.roleKey !== 'admin') {
          alert('Solo el Administrador General puede eliminar registros.');
          return;
        }
        if (confirm('¿Deseas eliminar este registro? Esta acción no se puede deshacer.')) {
          setMovements(movements.filter(m => m.id !== id));
        }
      };

      const handleSaveKeys = (e) => {
        e.preventDefault();
        setDevicePins(editedPins);
        setIsKeysModalOpen(false);
      };

      const handleSaveKpis = (e) => {
        e.preventDefault();
        setKpiTitles(editedKpis);
        setIsKpiModalOpen(false);
      };

      const handleSaveFreight = (e) => {
        e.preventDefault();
        if (!freightForm.client || !freightForm.amount) return;

        const newItem = {
          id: `fl-${Date.now().toString().slice(-4)}`,
          type: 'freight',
          ...freightForm,
          amount: Number(freightForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsFreightModalOpen(false);
        setFreightForm({
          client: '', origin: '', destination: '', amount: '',
          date: '2026-10-28',
          driverName: 'Emes', vehicle: 'Camión Volvo FH 4x2',
          invoicingStatus: 'No Facturado', vatApplicable: false
        });
      };

      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!expenseForm.amount || !expenseForm.description) return;

        const newItem = {
          id: `exp-${Date.now().toString().slice(-4)}`,
          type: 'expense',
          ...expenseForm,
          amount: Number(expenseForm.amount),
          createdBy: currentDevice
        };

        setMovements([newItem, ...movements]);
        setIsExpenseModalOpen(false);
        setExpenseForm({
          category: 'Combustible', amount: '', description: '',
          date: '2026-10-28',
          driverName: 'Emes', receiptImage: null, vatCreditEligible: false
        });
      };

      if (!isAuthenticated) {
        return h('div', {
          className: 'min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4'
        },
          h('div', {
            className: 'max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 text-center shadow-2xl'
          },
            h('div', {
              className: 'w-12 h-12 bg-emerald-950 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400'
            }, h(Lock)),
            h('div', null,
              h('h2', { className: 'text-base font-bold text-white' }, currentDevice),
              h('p', { className: 'text-xs text-slate-400 mt-1' }, 'Ingresa tu clave de acceso')
            ),
            h('form', { onSubmit: handleLogin, className: 'space-y-4' },
              h('input', {
                type: 'password', maxLength: 10, required: true, autoFocus: true,
                placeholder: 'Ingresa PIN / Clave', value: pinInput,
                onChange: (e) => setPinInput(e.target.value),
                className: 'w-full text-center bg-slate-950 border border-slate-800 rounded-xl py-3 text-lg font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 tracking-widest'
              }),
              loginError && h('p', { className: 'text-xs text-rose-400 font-bold' }, loginError),
              h('button', {
                type: 'submit',
                className: 'w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs uppercase tracking-wider text-white transition'
              }, 'Ingresar a Dispositivo')
            ),
            h('div', { className: 'pt-2 border-t border-slate-800' },
              h('p', { className: 'text-[11px] text-slate-400 mb-1.5' }, '¿Cambiar de dispositivo?'),
              h('select', {
                value: currentDevice,
                onChange: (e) => handleDeviceSwitch(e.target.value),
                className: 'bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2 focus:outline-none w-full'
              }, DEFAULT_DEVICES.map(d => h('option', { key: d.id, value: d.name }, d.name)))
            )
          )
        );
      }

      return h('div', { className: 'min-h-screen bg-slate-950 text-slate-100 pb-20' },
        h('header', { className: 'bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10' },
          h('div', { className: 'max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3' },
            h('div', { className: 'flex items-center gap-2' },
              h('div', { className: 'p-2 bg-emerald-600 rounded-xl' }, h(Truck)),
              h('div', null,
                h('h1', { className: 'font-bold text-lg' }, 'FletesSync'),
                h('p', { className: 'text-[10px] text-emerald-400 font-semibold uppercase' }, 'Gestión de Fletes y Servicios')
              )
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('span', { className: 'text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/40 px-2.5 py-1 rounded-lg' }, activeDeviceObj.name),
              h('button', { onClick: () => setIsAuthenticated(false), className: 'p-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-lg border border-slate-700', title: 'Cerrar sesión' }, h(LogOut))
            )
          )
        ),
        h('main', { className: 'max-w-5xl mx-auto p-4 space-y-6' },
          h('div', { className: 'bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4' },
            h('div', { className: 'flex items-center gap-2' },
              h(Clock),
              h('span', { className: 'text-xs text-slate-400 font-bold uppercase' }, 'Mes:'),
              h('input', { type: 'month', value: selectedMonth, onChange: (e) => setSelectedMonth(e.target.value), className: 'bg-transparent text-sm font-bold text-white focus:outline-none cursor-pointer' })
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2 w-full sm:w-auto' },
              activeDeviceObj.roleKey === 'admin' && [
                h('button', { key: 'btn-kpi', onClick: () => { setEditedKpis({ ...kpiTitles }); setIsKpiModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-purple-900 hover:bg-purple-800 border border-purple-500/40 text-purple-200 font-bold text-xs px-3 py-2 rounded-xl transition' }, h(Edit), ' Nombres KPI'),
                h('button', { key: 'btn-keys', onClick: () => { setEditedPins({ ...devicePins }); setIsKeysModalOpen(true); }, className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-amber-900 hover:bg-amber-800 border border-amber-500/40 text-amber-200 font-bold text-xs px-3 py-2 rounded-xl transition' }, h(Key), ' Control Claves')
              ],
              activeDeviceObj.roleKey !== 'driver2' && h('button', { onClick: () => setIsFreightModalOpen(true), className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-lg transition' }, h(PlusCircle), ' + Flete'),
              h('button', { onClick: () => setIsExpenseModalOpen(true), className: 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-lg transition' }, h(Camera), ' + Gasto')
            )
          ),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4' },
            h('div', { className: 'bg-slate-900 p-4 rounded-xl border border-slate-800' },
              h('span', { className: 'text-xs text-slate-400 font-bold uppercase' }, kpiTitles.freights),
              h('p', { className: 'text-xl font-bold text-emerald-400 mt-1' }, formatMoney(metrics.totalFreights))
            ),
            h('div', { className: 'bg-slate-900 p-4 rounded-xl border border-slate-800' },
              h('span', { className: 'text-xs text-slate-400 font-bold uppercase' }, kpiTitles.expenses),
              h('p', { className: 'text-xl font-bold text-rose-400 mt-1' }, formatMoney(metrics.totalExpenses))
            ),
            h('div', { className: 'bg-slate-900 p-4 rounded-xl border border-slate-800' },
              h('span', { className: 'text-xs text-slate-400 font-bold uppercase' }, kpiTitles.netProfit),
              h('p', { className: 'text-xl font-bold text-white mt-1' }, formatMoney(metrics.netTotal))
            )
          ),
          activeDeviceObj.roleKey === 'driver1' && h('div', { className: 'bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-2xl shadow-lg' },
            h('span', { className: 'text-xs font-bold text-emerald-400 uppercase tracking-wider' }, kpiTitles.emesShare),
            h('p', { className: 'text-3xl font-black text-emerald-300 mt-1' }, formatMoney(metrics.driver1Share))
          ),
          activeDeviceObj.roleKey === 'owner' && h('div', { className: 'bg-amber-950/30 border border-amber-500/40 p-4 rounded-2xl shadow-lg' },
            h('span', { className: 'text-xs font-bold text-amber-400 uppercase tracking-wider' }, kpiTitles.pelaoShare),
            h('p', { className: 'text-3xl font-black text-amber-300 mt-1' }, formatMoney(metrics.ownerShare))
          ),
          activeDeviceObj.roleKey === 'admin' && h('div', { className: 'bg-purple-950/30 border border-purple-500/40 p-4 rounded-2xl shadow-lg grid grid-cols-1 sm:grid-cols-2 gap-4' },
            h('div', null,
              h('span', { className: 'text-xs font-bold text-emerald-400 uppercase tracking-wider' }, kpiTitles.emesShare),
              h('p', { className: 'text-2xl font-black text-emerald-300 mt-1' }, formatMoney(metrics.driver1Share))
            ),
            h('div', null,
              h('span', { className: 'text-xs font-bold text-amber-400 uppercase tracking-wider' }, kpiTitles.pelaoShare),
              h('p', { className: 'text-2xl font-black text-amber-300 mt-1' }, formatMoney(metrics.ownerShare))
            )
          ),
          h('div', { className: 'bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-4' },
            h('h3', { className: 'font-bold text-sm text-white flex items-center gap-2' }, h(FileText), ' Movimientos de este Mes'),
            h('div', { className: 'space-y-2' },
              monthlyMovements.length === 0 ? h('p', { className: 'text-xs text-slate-500 py-3 text-center' }, 'No hay movimientos en este mes.') :
              monthlyMovements.map(item => h('div', { key: item.id, className: 'bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs gap-3' },
                h('div', null,
                  h('p', { className: `font-bold ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}` }, item.type === 'freight' ? `Flete: ${item.client}` : `Gasto: ${item.category}`),
                  h('p', { className: 'text-slate-400 text-[11px] mt-0.5' }, item.type === 'freight' ? `${item.origin} ➔ ${item.destination}` : item.description),
                  h('span', { className: 'text-slate-500 text-[10px]' }, `${item.date} • Creado por: ${item.createdBy || 'Sistema'}`)
                ),
                h('div', { className: 'flex items-center gap-3' },
                  h('span', { className: `font-bold ${item.type === 'freight' ? 'text-emerald-400' : 'text-rose-400'}` }, `${item.type === 'freight' ? '+' : '-'}${formatMoney(item.amount)}`),
                  h('button', { onClick: () => handleDelete(item.id), className: 'text-slate-500 hover:text-rose-400 p-1', title: 'Eliminar' }, h(Trash2))
                )
              ))
            )
          )
        ),
        isKeysModalOpen && h('div', { className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-800 pb-2' },
              h('h3', { className: 'font-bold text-base text-white flex items-center gap-2' }, h(Shield), 'Administrar Claves'),
              h('button', { onClick: () => setIsKeysModalOpen(false), className: 'text-slate-400 hover:text-white' }, h(X))
            ),
            h('form', { onSubmit: handleSaveKeys, className: 'space-y-3.5 text-xs' },
              DEFAULT_DEVICES.map(dev => h('div', { key: dev.id, className: 'bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1' },
                h('span', { className: 'font-bold text-slate-200 block' }, dev.name),
                h('p', { className: 'text-[10px] text-slate-400 mb-1.5' }, dev.role),
                h('div', { className: 'flex items-center gap-2' },
                  h('label', { className: 'text-slate-400 text-[11px]' }, 'Clave / PIN:'),
                  h('input', {
                    type: 'text', maxLength: 10, required: true,
                    value: editedPins[dev.id] || '',
                    onChange: (e) => setEditedPins({ ...editedPins, [dev.id]: e.target.value }),
                    className: 'bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-emerald-400 font-bold text-center w-28 focus:outline-none focus:border-emerald-500'
                  })
                )
              )),
              h('div', { className: 'flex justify-end gap-2 pt-3 border-t border-slate-800' },
                h('button', { type: 'button', onClick: () => setIsKeysModalOpen(false), className: 'px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-750' }, 'Cancelar'),
                h('button', { type: 'submit', className: 'px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl' }, 'Guardar Claves')
              )
            )
          )
        ),
        isKpiModalOpen && h('div', { className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50' },
          h('div', { className: 'bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-md space-y-4 shadow-2xl' },
            h('div', { className: 'flex justify-between items-center border-b border-slate-800 pb-2' },
              h('h3', { className: 'font-bold text-base text-white flex items-center gap-2' }, h(Edit), 'Modificar KPI'),
              h('button', { onClick: () => setIsKpiModalOpen(false), className: 'text-slate-400 hover:text-white' }, h(X))
            ),
            h('form', { onSubmit: handleSaveKpis, className: 'space-y-3.5 text-xs' },
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5' }, 'Nombre para Total Fletes'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.freights || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, freights: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500'
                })
              ),
              h('div', null,
                h('label', { className: 'text-slate-400 block mb-1.5' }, 'Nombre para Total Gastos'),
                h('input', {
                  type: 'text', required: true, value: editedKpis.expenses || '',
                  onChange: (e) => setEditedKpis({ ...editedKpis, expenses: e.target.value }),
                  className: 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-purple-500'
                })
              ),
              h('div', null,
