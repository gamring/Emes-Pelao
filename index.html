<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Fletes y Servicios</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICONOS LUCIDE ADAPTADOS ---
    const Truck = () => <i data-lucide="truck" className="w-5 h-5"></i>;
    const Receipt = () => <i data-lucide="receipt" className="w-5 h-5"></i>;
    const BarChart3 = () => <i data-lucide="bar-chart-3" className="w-5 h-5"></i>;
    const Clock = () => <i data-lucide="clock" className="w-5 h-5"></i>;
    const Search = () => <i data-lucide="search" className="w-4 h-4"></i>;
    const Download = () => <i data-lucide="download" className="w-4 h-4"></i>;
    const Smartphone = () => <i data-lucide="smartphone" className="w-4 h-4"></i>;
    const Sparkles = () => <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>;
    const TrendingUp = () => <i data-lucide="trending-up" className="w-4 h-4"></i>;
    const TrendingDown = () => <i data-lucide="trending-down" className="w-4 h-4"></i>;
    const DollarSign = () => <i data-lucide="dollar-sign" className="w-4 h-4"></i>;
    const AlertCircle = () => <i data-lucide="alert-circle" className="w-4 h-4"></i>;
    const Trash2 = () => <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>;
    const Edit3 = () => <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>;
    const UserCheck = () => <i data-lucide="user-check" className="w-4 h-4"></i>;

    const INITIAL_MOVEMENTS = [
      {
        id: 'fl-101', type: 'freight', client: 'Constructora Del Sol', origin: 'Santiago Central',
        destination: 'Valparaíso Puerto', amount: 300000, vehicle: 'Camión Volvo FH 4x2',
        driverName: 'Juan Pérez (Conductor 1)', date: '2026-10-25', status: 'Completado',
        invoicingStatus: 'Factura Pagada', paymentStatus: 'Pagado', notes: 'Encofrados metálicos.', createdBy: 'Dispositivo 1 - Conductor 1'
      },
      {
        id: 'exp-201', type: 'expense', category: 'Combustible', amount: 60000, date: '2026-10-25',
        description: 'Carga Diésel Shell', vehicle: 'Camión Volvo FH 4x2', driverName: 'Juan Pérez (Conductor 1)', createdBy: 'Dispositivo 1 - Conductor 1'
      },
      {
        id: 'fl-102', type: 'freight', client: 'Agrocomercial Norte', origin: 'Rancagua',
        destination: 'Coquimbo', amount: 480000, vehicle: 'Mercedes-Benz Actros',
        driverName: 'Carlos Gómez (Conductor 2)', date: '2026-10-27', status: 'En Curso',
        invoicingStatus: 'Facturado (Pendiente)', paymentStatus: 'Pendiente', notes: 'Frutas refrigeradas.', createdBy: 'Dispositivo 4 - Conductor 2'
      },
      {
        id: 'exp-203', type: 'expense', category: 'Combustible', amount: 110000, date: '2026-10-27',
        description: 'Estación Copec', vehicle: 'Mercedes-Benz Actros', driverName: 'Carlos Gómez (Conductor 2)', createdBy: 'Dispositivo 4 - Conductor 2'
      }
    ];

    const DEVICES = [
      { id: 'dev-1', roleKey: 'driver1', name: 'Dispositivo 1 - Conductor 1', role: 'Conductor (50% Beneficio)' },
      { id: 'dev-2', roleKey: 'owner', name: 'Dispositivo 2 - Dueño del Camión', role: 'Dueño (50% Beneficio)' },
      { id: 'dev-3', roleKey: 'admin', name: 'Dispositivo 3 - Administrador General', role: 'Control Total & Facturación' },
      { id: 'dev-4', roleKey: 'driver2', name: 'Dispositivo 4 - Conductor 2', role: 'Conductor Registro Gastos' }
    ];

    const EXPENSE_CATEGORIES = ['Combustible', 'Viáticos', 'Peajes', 'Reparaciones'];
    const INVOICE_STATUSES = ['No Facturado', 'Facturado (Pendiente)', 'Factura Pagada'];

    function App() {
      const [movements, setMovements] = useState(() => {
        const saved = localStorage.getItem('fletes_movements');
        return saved ? JSON.parse(saved) : INITIAL_MOVEMENTS;
      });

      const [currentDevice, setCurrentDevice] = useState(DEVICES[0].name);
      const [driver1CustomName, setDriver1CustomName] = useState('Juan Pérez');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMonth, setSelectedMonth] = useState('2026-10');
      const [searchTerm, setSearchTerm] = useState('');

      const activeDeviceObj = useMemo(() => DEVICES.find(d => d.name === currentDevice) || DEVICES[0], [currentDevice]);

      useEffect(() => {
        localStorage.setItem('fletes_movements', JSON.stringify(movements));
        if (window.lucide) window.lucide.createIcons();
      }, [movements, activeTab, currentDevice]);

      const monthlyMovements = useMemo(() => movements.filter(m => m.date && m.date.startsWith(selectedMonth)), [movements, selectedMonth]);

      const metrics = useMemo(() => {
        let totalFreights = 0, totalExpenses = 0, pendingPayments = 0;
        let driver1Freights = 0, driver1Expenses = 0;

        monthlyMovements.forEach(m => {
          if (m.type === 'freight') {
            totalFreights += Number(m.amount) || 0;
            if (m.driverName?.includes('Conductor 1')) driver1Freights += Number(m.amount) || 0;
            if (m.paymentStatus === 'Pendiente' || m.invoicingStatus === 'Facturado (Pendiente)') pendingPayments += Number(m.amount) || 0;
          } else {
            totalExpenses += Number(m.amount) || 0;
            if (m.driverName?.includes('Conductor 1')) driver1Expenses += Number(m.amount) || 0;
          }
        });

        const netTotal = totalFreights - totalExpenses;
        const driver1Net = driver1Freights - driver1Expenses;

        return {
          totalFreights, totalExpenses, netTotal,
          ownerShare: netTotal > 0 ? netTotal * 0.5 : 0,
          driver1Share: driver1Net > 0 ? driver1Net * 0.5 : 0,
          pendingPayments
        };
      }, [monthlyMovements]);

      const formatMoney = (val) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-20">
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <div className="p-2 bg-emerald-600 rounded-xl"><Truck /></div>
                <div>
                  <h1 className="font-bold text-lg">FletesSync</h1>
                  <p className="text-[10px] text-emerald-400 font-semibold uppercase">4 Dispositivos & Reparto 50%</p>
                </div>
              </div>

              <select 
                value={currentDevice} 
                onChange={(e) => setCurrentDevice(e.target.value)}
                className="bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700 rounded-lg p-2 focus:outline-none"
              >
                {DEVICES.map(d => <option key={d.id} value={d.name}>{d.name} ({d.role})</option>)}
              </select>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4">
            {/* Filtro Mes */}
            <div className="mb-6 bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <Clock />
                <span className="text-xs text-slate-400">Mes:</span>
                <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="bg-transparent text-sm font-bold text-white focus:outline-none cursor-pointer" />
              </div>
            </div>

            {/* VISTA CONDUCTOR 4 / DISPOSITIVO 4 */}
            {activeDeviceObj.roleKey === 'driver2' ? (
              <div className="space-y-4">
                <div className="bg-blue-950/40 border border-blue-500/30 p-4 rounded-xl text-xs text-blue-300">
                  ⚠️ <strong>Conductor 2:</strong> Solo puedes visualizar y registrar tus propios gastos.
                </div>
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <h3 className="font-bold text-sm mb-3">Historial de Gastos Asignados</h3>
                  <div className="space-y-2">
                    {monthlyMovements.filter(m => m.type === 'expense' && (m.driverName?.includes('Conductor 2') || m.createdBy?.includes('Dispositivo 4'))).map(item => (
                      <div key={item.id} className="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                        <div>
                          <span className="font-bold text-white text-xs">{item.category}</span>
                          <p className="text-[11px] text-slate-400">{item.description}</p>
                        </div>
                        <span className="font-bold text-rose-400">{formatMoney(item.amount)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              /* VISTA GENERAL / ROLES 1, 2 Y 3 */
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Total Fletes</span>
                    <p className="text-xl font-bold text-emerald-400 mt-1">{formatMoney(metrics.totalFreights)}</p>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Total Gastos</span>
                    <p className="text-xl font-bold text-rose-400 mt-1">{formatMoney(metrics.totalExpenses)}</p>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400">Utilidad Neta</span>
                    <p className="text-xl font-bold text-white mt-1">{formatMoney(metrics.netTotal)}</p>
                  </div>
                </div>

                {/* BENEFICIOS 50% */}
                {activeDeviceObj.roleKey === 'driver1' && (
                  <div className="bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-xl">
                    <span className="text-xs font-bold text-emerald-400">TU BENEFICIO 50% (Conductor 1)</span>
                    <p className="text-2xl font-black text-emerald-300 mt-1">{formatMoney(metrics.driver1Share)}</p>
                  </div>
                )}

                {activeDeviceObj.roleKey === 'owner' && (
                  <div className="bg-amber-950/30 border border-amber-500/40 p-4 rounded-xl">
                    <span className="text-xs font-bold text-amber-400">TU BENEFICIO 50% (Dueño Camión)</span>
                    <p className="text-2xl font-black text-amber-300 mt-1">{formatMoney(metrics.ownerShare)}</p>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
```eof
